version: 2.1

jobs:
  nison_runtime_0001_0010:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install pytest
          command: |
            python -m pip install --upgrade pip
            python -m pip install pytest
      - run:
          name: Run Nison unit tests 0001-0010
          working_directory: RUNTIME/NISON_EVALUATORS_V1
          command: |
            python -m pytest -q test_nison_0001_0002_engulfing.py test_nison_0003_0010_runtime.py
      - run:
          name: Run unified router smoke
          working_directory: RUNTIME/NISON_EVALUATORS_V1
          command: python test_nison_router_smoke_0001_0010.py

workflows:
  build_and_test:
    jobs:
      - nison_runtime_0001_0010
