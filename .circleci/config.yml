# BACKTEST-ONLY: governed 2016-2024 integration, then backtest only after gate PASS.
# 2025 remains OOS-locked. No Nison/Murphy regeneration and no legacy build pipeline.
version: 2.1

jobs:
  backtest_only:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Download governed source stack
          command: |
            set -eu
            test -n "${DROPBOX_ACCESS_TOKEN:-}"
            mkdir -p artifacts/raw artifacts/unpacked
            fetch() { curl -L --fail --silent --show-error -X POST https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H "Dropbox-API-Arg: {\"path\":\"$1\"}" -o "$2"; }
            fetch '/New 8/NISON_2016_2024_FULL_EVIDENCE.csv' artifacts/raw/nison.csv
            fetch '/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip' artifacts/raw/murphy.zip
            fetch '/New 8/GBPUSD_H1_2016_2025_MASTER.zip' artifacts/raw/h1.zip
            fetch '/New 8/GBPUSD_MARKET_STATE 6.csv' artifacts/raw/market_state.csv
            fetch '/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_MULTI_TIMEFRAME_READER_V1.zip' artifacts/raw/mtf.zip
            fetch '/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_CONTEXT_MEMORY_V1.zip' artifacts/raw/historical_context.zip
            fetch '/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_OUTCOME_MEMORY_V1.zip' artifacts/raw/historical_outcome.zip
            fetch '/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_SIMILARITY_MEMORY_V2.zip' artifacts/raw/similarity.zip
            fetch '/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_CONTEXT_AWARE_RETRIEVAL_V2.zip' artifacts/raw/retrieval.zip
            unzip -q artifacts/raw/h1.zip -d artifacts/unpacked/h1
            unzip -q artifacts/raw/murphy.zip -d artifacts/unpacked/murphy
            unzip -q artifacts/raw/mtf.zip -d artifacts/unpacked/mtf
            unzip -q artifacts/raw/historical_context.zip -d artifacts/unpacked/historical_context
            unzip -q artifacts/raw/historical_outcome.zip -d artifacts/unpacked/historical_outcome
            unzip -q artifacts/raw/similarity.zip -d artifacts/unpacked/similarity
            unzip -q artifacts/raw/retrieval.zip -d artifacts/unpacked/retrieval
            export H1=$(find artifacts/unpacked/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            export MURPHY=$(find artifacts/unpacked/murphy -type f -name 'MURPHY_2016_2024_FULL_EVIDENCE.csv' | head -1)
            export MTF=$(find artifacts/unpacked/mtf -type f -name 'GBPUSD_MTF_H4_H1.csv' | head -1)
            export HC=$(find artifacts/unpacked/historical_context -type f -name 'HISTORICAL_CONTEXT_MEMORY.csv' | head -1)
            export HO=$(find artifacts/unpacked/historical_outcome -type f -name 'HISTORICAL_OUTCOMES.csv' | head -1)
            test -n "$H1"; test -n "$MURPHY"; test -n "$MTF"; test -n "$HC"; test -n "$HO"
            echo "export H1='$H1'" >> "$BASH_ENV"
            echo "export MURPHY='$MURPHY'" >> "$BASH_ENV"
            echo "export MTF='$MTF'" >> "$BASH_ENV"
            echo "export HC='$HC'" >> "$BASH_ENV"
            echo "export HO='$HO'" >> "$BASH_ENV"
      - run:
          name: Verify frozen Nison and Murphy scopes
          command: |
            set -eu
            python - <<'PY'
            import os, pandas as pd
            n=pd.read_csv('artifacts/raw/nison.csv',usecols=['timestamp','rule_id'])
            t=pd.to_datetime(n.timestamp,utc=True,format='mixed')
            assert t.dt.year.min()==2016 and t.dt.year.max()==2024
            assert n.rule_id.nunique()==44 and len(n)==2428448
            m=pd.read_csv(os.environ['MURPHY'],usecols=['timestamp','source_rule_id'])
            t=pd.to_datetime(m.timestamp,utc=True,format='mixed')
            assert t.dt.year.min()==2016 and t.dt.year.max()==2024
            print('FROZEN_SCOPE_PASS',len(n),n.rule_id.nunique(),len(m))
            PY
      - run:
          name: Integration Gate (must PASS before backtest)
          command: |
            set -eu
            mkdir -p artifacts/integration_gate
            python BACKTEST/GOVERNED_INTEGRATION_GATE_V2.py \
              --h1 "$H1" \
              --market-state artifacts/raw/market_state.csv \
              --mtf "$MTF" \
              --murphy "$MURPHY" \
              --nison artifacts/raw/nison.csv \
              --historical-context "$HC" \
              --historical-outcome "$HO" \
              --similarity artifacts/unpacked/similarity \
              --retrieval artifacts/unpacked/retrieval \
              --handoff compatibility/knowledge_decision_handoff.py \
              --decision-brain RECOVERED_SOURCES/DECISION_BRAIN_V1/decision_brain.py \
              --output artifacts/integration_gate/GOVERNED_INTEGRATION_GATE_V2.json
      - store_artifacts:
          path: artifacts/integration_gate
          destination: governed_integration_gate_2026_08_28
      - run:
          name: 2016-2024 governed Decision Brain backtest
          command: |
            set -eu
            mkdir -p artifacts/decision_brain_backtest_2016_2024
            python BACKTEST/DEV_BACKTEST_RUNNER_V1.py \
              --h1 "$H1" \
              --market artifacts/raw/market_state.csv \
              --mtf "$MTF" \
              --murphy "$MURPHY" \
              --nison artifacts/raw/nison.csv \
              --historical-context "$HC" \
              --historical-outcome "$HO" \
              --similarity artifacts/unpacked/similarity \
              --retrieval artifacts/unpacked/retrieval \
              --output-dir artifacts/decision_brain_backtest_2016_2024
      - run:
          name: Assert 2025 stays locked in output
          command: |
            set -eu
            test -f artifacts/decision_brain_backtest_2016_2024/unified_78_events_2016_2024.csv
            ! grep -q '2025-' artifacts/decision_brain_backtest_2016_2024/unified_78_events_2016_2024.csv
      - store_artifacts:
          path: artifacts/decision_brain_backtest_2016_2024
          destination: decision_brain_backtest_2016_2024_governed

workflows:
  backtest_only:
    jobs:
      - backtest_only
