# BACKTEST-ONLY / GOVERNED
# Branch: diagnostic/murphy-34-recovery-2026-09-02
# IMPORTANT: automatic VCS pushes run only lightweight build-and-test plus the explicitly
# gated Murphy archive audit on this recovery branch. The governed backtest remains manual.
# 2025 remains locked/OOS.
version: 2.1

parameters:
  run_integration_gate:
    type: boolean
    default: false
  run_governed_backtest:
    type: boolean
    default: false
  run_murphy_archive_audit:
    type: boolean
    default: false

jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install lightweight CI dependencies
          command: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Canonical E2E integration contract test
          command: python BACKTEST/INTEGRATION_CONTRACT_TEST_V1.py
      - run:
          name: Compile Python sources
          command: python -m compileall -q BACKTEST compatibility RUNTIME RECOVERED_SOURCES

  murphy_archive_audit:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install audit dependencies
          command: python -m pip install --upgrade pip
      - run:
          name: Audit original Murphy workspace archive (3-part reconstruction)
          command: python BACKTEST/MURPHY_ARCHIVE_PRODUCER_BINDING_AUDIT_V1.py
          no_output_timeout: 30m
      - store_artifacts:
          path: artifacts/murphy_34_workspace_audit
          destination: murphy_34_workspace_audit

  governed_backtest_only:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install runtime dependencies
          command: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Canonical E2E integration contract test
          command: python BACKTEST/INTEGRATION_CONTRACT_TEST_V1.py
      - run:
          name: Governed E2E smoke preflight V3
          command: python BACKTEST/GOVERNED_E2E_SMOKE_V3.py --root .
      - store_artifacts:
          path: artifacts/integration_contract_test
          destination: canonical_e2e_contract_2026_08_28
      - run:
          name: Acquire governed source stack
          command: python BACKTEST/CIRCLECI_ACQUIRE_GOVERNED_SOURCES.py
      - run:
          name: Frozen scope and 2025 lock check
          command: python BACKTEST/CIRCLECI_FROZEN_SCOPE_CHECK.py
      - run:
          name: GOVERNED INTEGRATION GATE V3
          command: python BACKTEST/CIRCLECI_RUN_GOVERNED_GATE.py
      - store_artifacts:
          path: artifacts/integration_gate
          destination: governed_integration_gate_2026_08_28
      - when:
          condition: << pipeline.parameters.run_governed_backtest >>
          steps:
            - run:
                name: 2016-2024 Decision Brain backtest (only after Gate PASS)
                command: python BACKTEST/CIRCLECI_RUN_GOVERNED_BACKTEST.py
                no_output_timeout: 20m
            - run:
                name: Decision-to-execution funnel contract
                command: python BACKTEST/EXECUTION_FUNNEL_CONTRACT_V1.py --events artifacts/decision_brain_backtest_2016_2024/decision_events_2016_2024.csv --output artifacts/decision_brain_backtest_2016_2024/execution_funnel_contract_v1.json
            - run:
                name: Assert 2025 absent from development output
                command: python BACKTEST/CIRCLECI_ASSERT_2025_LOCK.py
            - store_artifacts:
                path: artifacts/decision_brain_backtest_2016_2024
                destination: decision_brain_backtest_2016_2024_governed

workflows:
  build_and_test:
    when: pipeline.git.branch != "governed-gate-run-2026-08-29"
    jobs:
      - build_and_test

  murphy_archive_recovery:
    when:
      or:
        - << pipeline.parameters.run_murphy_archive_audit >>
        - pipeline.git.branch == "diagnostic/murphy-34-recovery-2026-09-02"
    jobs:
      - murphy_archive_audit

  governed_execution:
    when:
      or:
        - << pipeline.parameters.run_integration_gate >>
        - << pipeline.parameters.run_governed_backtest >>
        - pipeline.git.branch == "governed-gate-run-2026-08-29"
    jobs:
      - governed_backtest_only
