version: 2.1

jobs:
  decision_brain_backtest_2016_2024_only:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Download existing evidence from Dropbox
          command: |
            set -eu
            test -n "${DROPBOX_ACCESS_TOKEN:-}"
            mkdir -p artifacts/nison artifacts/murphy artifacts/source/unpacked
            python - <<'PY'
            import json, os
            from urllib.request import Request, urlopen
            token=os.environ['DROPBOX_ACCESS_TOKEN']
            def download(path, out, timeout=900):
                req=Request('https://content.dropboxapi.com/2/files/download', data=b'', method='POST', headers={'Authorization':f'Bearer {token}','Dropbox-API-Arg':json.dumps({'path':path})})
                with urlopen(req, timeout=timeout) as r:
                    with open(out,'wb') as f:
                        while True:
                            chunk=r.read(1024*1024)
                            if not chunk: break
                            f.write(chunk)
            download('/New 8/NISON_2016_2024_FULL_EVIDENCE.csv','artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv')
            download('/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip','/tmp/murphy.zip')
            download('/New 8/GBPUSD_H1_2016_2025_MASTER.zip','artifacts/source/GBPUSD_H1_2016_2025_MASTER.zip',300)
            download('/New 8/GBPUSD_MARKET_STATE 6.csv','artifacts/GBPUSD_MARKET_STATE.csv',300)
            PY
            unzip -q /tmp/murphy.zip -d artifacts/murphy
            MURPHY_CSV=$(find artifacts/murphy -type f -iname '*.csv' | head -1)
            test -n "$MURPHY_CSV"
            mv "$MURPHY_CSV" artifacts/murphy/MURPHY_DROPBOX_FULL_EVIDENCE.csv
            unzip -q artifacts/source/GBPUSD_H1_2016_2025_MASTER.zip -d artifacts/source/unpacked
            SOURCE_CSV=$(find artifacts/source/unpacked -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            test -n "$SOURCE_CSV"
            echo "SOURCE_CSV=$SOURCE_CSV" >> "$BASH_ENV"
      - run:
          name: Validate Murphy evidence reconciliation
          command: |
            set -eu
            mkdir -p artifacts/murphy
            python - <<'PY'
            import base64
            from pathlib import Path
            src=Path('BACKTEST/DEV_BACKTEST_R1_MURPHY_SOURCE.zip.b64.txt')
            out=Path('/tmp/murphy_embedded.zip')
            out.write_bytes(base64.b64decode(src.read_text()))
            PY
            mkdir -p /tmp/murphy_embedded
            unzip -q /tmp/murphy_embedded.zip -d /tmp/murphy_embedded
            GITHUB_CSV=$(find /tmp/murphy_embedded -type f -iname '*.csv' | head -1)
            test -n "$GITHUB_CSV"
            python tools/reconcile_murphy_evidence_v1.py \
              --github-source "$GITHUB_CSV" \
              --dropbox-source artifacts/murphy/MURPHY_DROPBOX_FULL_EVIDENCE.csv \
              --allowlist governance/DECISION_BRAIN_RULE_ALLOWLIST_V1.json \
              --output artifacts/murphy/reconciliation.json
      - run:
          name: Run frozen Decision Brain backtest 2016-2024 only
          command: |
            set -eu
            mkdir -p artifacts/decision_brain_backtest_2016_2024
            python BACKTEST/DEV_BACKTEST_RUNNER_V1.py \
              --h1 "$SOURCE_CSV" \
              --murphy artifacts/murphy/MURPHY_DROPBOX_FULL_EVIDENCE.csv \
              --nison artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv \
              --context artifacts/GBPUSD_MARKET_STATE.csv \
              --output-dir artifacts/decision_brain_backtest_2016_2024
      - store_artifacts:
          path: artifacts/murphy
          destination: murphy_reconciliation
      - store_artifacts:
          path: artifacts/decision_brain_backtest_2016_2024
          destination: decision_brain_backtest_2016_2024

workflows:
  backtest_only_2016_2024:
    jobs:
      - decision_brain_backtest_2016_2024_only
