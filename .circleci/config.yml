version: 2.1

jobs:
  final_2025_governed_78_rule_v1:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install runtime dependencies
          command: python -m pip install --upgrade pip pandas pytest pyyaml
      - run:
          name: Acquire authoritative 2025 H1 source
          command: |
            set -eu
            mkdir -p /tmp/final_78/h1
            if [ -n "${NISON_2025_SOURCE_URL:-}" ]; then
              curl -L --fail --silent --show-error "$NISON_2025_SOURCE_URL" -o /tmp/final_78/h1/source.zip
            elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then
              curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/final_78/h1/source.zip
            else
              echo 'BLOCKED: configure CircleCI project secret NISON_2025_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2
            fi
            unzip -q /tmp/final_78/h1/source.zip -d /tmp/final_78/h1
            H1_CSV=$(find /tmp/final_78/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            test -n "$H1_CSV"; echo "export H1_CSV=$H1_CSV" >> "$BASH_ENV"
      - run:
          name: Acquire authoritative 2026/2025 M1 source
          command: |
            set -eu
            mkdir -p /tmp/final_78/m1
            if [ -n "${MURPHY_M1_SOURCE_URL:-}" ]; then
              curl -L --fail --silent --show-error "$MURPHY_M1_SOURCE_URL" -o /tmp/final_78/m1/source.zip
            elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then
              curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_M1_MASTER_2016_2026_V1.zip"}' -o /tmp/final_78/m1/source.zip
            else
              echo 'BLOCKED: configure CircleCI project secret MURPHY_M1_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2
            fi
            unzip -q /tmp/final_78/m1/source.zip -d /tmp/final_78/m1
            M1_CSV=$(find /tmp/final_78/m1 -type f -name '*.csv' | head -1)
            test -n "$M1_CSV"; echo "export M1_CSV=$M1_CSV" >> "$BASH_ENV"
      - run:
          name: Build PIT-safe Murphy 0022/0023 evidence
          command: |
            set -eu; mkdir -p artifacts/final_78
            python OOS_2025/run_murphy_0022_0023_2025_pit_v1.py --h1 "$H1_CSV" --m1 "$M1_CSV" --oi evidence/cftc/2025/6b_oi_pit_bound_v1.json --output artifacts/final_78/MURPHY_0022_0023_2025.csv --manifest artifacts/final_78/MURPHY_0022_0023_2025_MANIFEST.json
      - run:
          name: Run governed 78-rule Decision Brain and P&L
          command: python OOS_2025/run_final_2025_governed_78_rule_v1.py --h1 "$H1_CSV" --m1 "$M1_CSV" --murphy-0022-0023 artifacts/final_78/MURPHY_0022_0023_2025.csv --output-dir artifacts/final_78
      - run:
          name: Diagnose 2025 executable-to-trade censoring
          command: python OOS_2025/diagnose_2025_execution_censoring_v1.py --events artifacts/final_78/FINAL_2025_DECISION_EVENTS.csv --h1 "$H1_CSV" --output-dir artifacts/final_78/censoring_audit
      - run:
          name: Audit 78-rule evidence coverage and direction arbitration
          command: python OOS_2025/run_2025_evidence_coverage_direction_audit_v1.py --market-state artifacts/final_78/GBPUSD_MARKET_STATE.csv --murphy-full artifacts/final_78/MURPHY_2025_FULL_EVIDENCE.csv --nison-full artifacts/final_78/NISON_2025_FULL_EVIDENCE_ENVELOPE.csv --murphy-candidate artifacts/final_78/MURPHY_2025_CANDIDATE_STREAM.csv --nison-candidate artifacts/final_78/NISON_2025_CANDIDATE_STREAM.csv --decision-events artifacts/final_78/FINAL_2025_DECISION_EVENTS.csv --output artifacts/final_78/DIRECTION_ARBITRATION_2025_AUDIT.json
      - run:
          name: Run as-of-safe pre-2025 memory runtime audit
          command: |
            set -eu
            test -n "${DROPBOX_ACCESS_TOKEN:-}" || { echo 'BLOCKED: configure CircleCI project secret DROPBOX_ACCESS_TOKEN.'; exit 2; }
            rm -rf /tmp/memory_runtime_v2; mkdir -p /tmp/memory_runtime_v2/zips artifacts/final_78/memory_shadow
            base='https://content.dropboxapi.com/2/files/download'; auth=(-H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Content-Type: application/octet-stream')
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_CONTEXT_MEMORY_V1.zip"}' -o /tmp/memory_runtime_v2/zips/context.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_OUTCOME_MEMORY_V1.zip"}' -o /tmp/memory_runtime_v2/zips/outcome.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_SIMILARITY_MEMORY_V2.zip"}' -o /tmp/memory_runtime_v2/zips/similarity.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_CONTEXT_AWARE_RETRIEVAL_V2.zip"}' -o /tmp/memory_runtime_v2/zips/retrieval.zip
            python OOS_2025/run_pre2025_memory_runtime_audit_v2.py --context /tmp/memory_runtime_v2/zips/context.zip --outcome /tmp/memory_runtime_v2/zips/outcome.zip --similarity /tmp/memory_runtime_v2/zips/similarity.zip --retrieval /tmp/memory_runtime_v2/zips/retrieval.zip --query-as-of 2024-12-31T12:00:00Z --output artifacts/final_78/memory_shadow/PRE2025_MEMORY_RUNTIME_AUDIT_V2.json
      - run:
          name: Run pre-2025 MTF and retrieval shadow probe
          command: |
            set -eu
            test -n "${DROPBOX_ACCESS_TOKEN:-}" || { echo 'BLOCKED: configure CircleCI project secret DROPBOX_ACCESS_TOKEN.'; exit 2; }
            rm -rf /tmp/mtf_retrieval_shadow; mkdir -p /tmp/mtf_retrieval_shadow/zips
            base='https://content.dropboxapi.com/2/files/download'; auth=(-H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Content-Type: application/octet-stream')
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_MULTI_TIMEFRAME_READER_V1.zip"}' -o /tmp/mtf_retrieval_shadow/zips/mtf.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_CONTEXT_AWARE_RETRIEVAL_V2.zip"}' -o /tmp/mtf_retrieval_shadow/zips/retrieval.zip
            python OOS_2025/run_pre2025_mtf_retrieval_shadow_probe_v2.py --mtf /tmp/mtf_retrieval_shadow/zips/mtf.zip --retrieval /tmp/mtf_retrieval_shadow/zips/retrieval.zip --query-as-of 2024-12-31T12:00:00Z --output artifacts/final_78/memory_shadow/PRE2025_MTF_RETRIEVAL_SHADOW_PROBE_V2.json
      - run:
          name: Verify governed 34+44 provenance and OOS gates
          command: python -c "import json; m=json.load(open('artifacts/final_78/FINAL_2025_DECISION_EVENTS_MANIFEST.json')); assert m['murphy_rule_count_in_event']==34,m; assert m['nison_rule_count_in_event']==44,m; assert m['fan_in_mode']=='LOSSLESS_FULL_EVIDENCE_WITH_LEGACY_DECISION_COMPAT',m; assert m['oos_tuning'] is False,m; assert m['new_rule_semantics'] is False,m; print(json.dumps(m,indent=2))"
      - run:
          name: Verify fail-closed provenance tests
          command: python -m pytest -q tests/evaluation/test_final_78_rule_provenance_gate_v1.py tests/evaluation/test_direction_arbitration_2025_v1.py
      - store_artifacts:
          path: artifacts/final_78
          destination: final_2025_governed_78_rule

  pre2025_arbitration_shadow_v1:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install shadow dependencies
          command: python -m pip install --upgrade pip pandas
      - run:
          name: Acquire pre-2025 sources
          command: |
            set -eu
            test -n "${DROPBOX_ACCESS_TOKEN:-}" || { echo 'BLOCKED: configure CircleCI project secret DROPBOX_ACCESS_TOKEN.'; exit 2; }
            mkdir -p /tmp/pre2025/{market,mtf,h1,m1,unpack}
            base='https://content.dropboxapi.com/2/files/download'; auth=(-H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Content-Type: application/octet-stream')
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_MARKET_STATE_READER_V1.zip"}' -o /tmp/pre2025/market/source.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_MULTI_TIMEFRAME_READER_V1.zip"}' -o /tmp/pre2025/mtf/source.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/pre2025/h1/source.zip
            curl -L --fail --silent --show-error "$base" "${auth[@]}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_M1_MASTER_2016_2026_V1.zip"}' -o /tmp/pre2025/m1/source.zip
            unzip -q /tmp/pre2025/market/source.zip -d /tmp/pre2025/market/unpack
            unzip -q /tmp/pre2025/mtf/source.zip -d /tmp/pre2025/mtf/unpack
            unzip -q /tmp/pre2025/h1/source.zip -d /tmp/pre2025/h1/unpack
            unzip -q /tmp/pre2025/m1/source.zip -d /tmp/pre2025/m1/unpack
            MARKET=$(find /tmp/pre2025/market/unpack -type f -name 'GBPUSD_MARKET_STATE.csv' | head -1)
            MTF=$(find /tmp/pre2025/mtf/unpack -type f -name 'GBPUSD_MTF_H4_H1.csv' | head -1)
            H1=$(find /tmp/pre2025/h1/unpack -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            M1=$(find /tmp/pre2025/m1/unpack -type f -name 'GBPUSD_M1_MASTER_2016_2026.csv' | head -1)
            test -n "$MARKET"; test -n "$MTF"; test -n "$H1"; test -n "$M1"
            echo "export MARKET=$MARKET" >> "$BASH_ENV"
            echo "export MTF=$MTF" >> "$BASH_ENV"
            echo "export H1=$H1" >> "$BASH_ENV"
            echo "export M1=$M1" >> "$BASH_ENV"
      - run:
          name: Run 2016-2024 context-gating shadow
          command: |
            set -eu
            rm -rf artifacts/pre2025_context_gate
            mkdir -p artifacts/pre2025_context_gate
            for year in 2016 2017 2018 2019 2020 2021 2022 2023 2024; do
              mkdir -p "artifacts/pre2025_context_gate/$year"
              python OOS_2025/pre2025_murphy_context_gate_shadow_v1.py \
                --market-state "$MARKET" \
                --mtf "$MTF" \
                --h1 "$H1" \
                --m1 "$M1" \
                --year "$year" \
                --output "artifacts/pre2025_context_gate/$year/CONTEXT_GATE.csv"
            done
            python - <<'PY'
            import json
            from pathlib import Path
            root = Path('artifacts/pre2025_context_gate')
            rows = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(root.glob('*/CONTEXT_GATE.json'))]
            summary = {
                'status': 'PASS_SHADOW_ONLY',
                'years': rows,
                'oos_2025_locked': True,
                'oos_tuning': False,
                'policy_changed': False,
                'new_rule_semantics': False,
                'replacement_pnl': False,
                'purpose': 'Test whether existing Brain context/regime improves the quality of existing Murphy direction.'
            }
            (root / 'PRE2025_MURPHY_CONTEXT_GATE_SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
            print(json.dumps(summary, indent=2, sort_keys=True))
            PY
      - run:
          name: Verify pre-2025 context-gate invariants
          command: |
            python - <<'PY'
            import json
            from pathlib import Path
            for p in Path('artifacts/pre2025_context_gate').glob('*/CONTEXT_GATE.json'):
                d = json.loads(p.read_text())
                assert d['oos_2025_locked'] is True
                assert d['oos_tuning'] is False
                assert d['policy_changed'] is False
                assert d['new_rule_semantics'] is False
                assert d['replacement_pnl'] is False
                assert d['future_feature_leakage'] is False
            print('pre-2025 Murphy context-gate invariants: PASS')
            PY
      - store_artifacts:
          path: artifacts/pre2025_context_gate
          destination: pre2025_context_gate_shadow

workflows:
  final_2025_governed_78_rule:
    jobs:
      - final_2025_governed_78_rule_v1
      - pre2025_arbitration_shadow_v1
