  nison_runtime_0031_0044:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pytest
      - run:
          working_directory: RUNTIME/NISON_EVALUATORS_V1
