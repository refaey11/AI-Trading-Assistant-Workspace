version: 2.1

jobs:
  nison_runtime_0001_0010:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pytest
      - run:
          working_directory: RUNTIME/NISON_EVALUATORS_V1
          command: python -m pytest -q test_nison_0001_0002_engulfing.py test_nison_0003_0010_runtime.py && python test_nison_router_smoke_0001_0010.py
  nison_runtime_0011_0020:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pytest
      - run:
          working_directory: RUNTIME/NISON_EVALUATORS_V1
          command: python -m pytest -q test_nison_0011_0020_runtime.py && python test_nison_router_smoke_0011_0020.py
  nison_runtime_0021_0030:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pytest
      - run:
          working_directory: RUNTIME/NISON_EVALUATORS_V1
