  historical_outcome_memory_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_historical_outcome_memory_boundary_v1.py}]
  similarity_memory_v2:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_similarity_memory_v2_boundary.py}]
  memory_integration_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_memory_evidence_package_v1.py}]
  outcome_to_scenario_evidence_policy_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_outcome_to_scenario_evidence_policy_v1.py}]
  decision_brain_v1_integration:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_decision_brain_v1_handoff_adapter.py}]
  decision_brain_final_e2e_readiness_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_decision_brain_final_e2e_readiness_v1.py}]
  risk_execution_runtime_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q risk_engine/test_risk_execution_runtime_v1.py tests/compatibility/test_decision_brain_final_e2e_readiness_v1.py}]
  tiz_optional_execution_adapter_v2:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/evaluation/test_tiz_optional_execution_adapter_v2.py}]
  decision_brain_pre_oos_freeze_guard_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_decision_brain_pre_oos_freeze_guard_v1.py}]
  decision_brain_rule_allowlist_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_decision_brain_rule_allowlist_v1.py}]
  rule_adapter_allowlist_runtime_gate_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_rule_adapter_allowlist_runtime_gate_v1.py}]
  frozen_decision_execution_bridge_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/evaluation/test_frozen_decision_execution_bridge_v1.py}]
  frozen_decision_2025_oos_evaluator_contract_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/compatibility/test_decision_brain_2025_oos_evaluator_contract_v1.py}]
  three_book_decision_evaluator_v1:
    docker: [{image: cimg/python:3.12}]
    steps: [checkout, {run: python -m pip install pytest && python -m pytest -q tests/evaluation/test_three_book_decision_evaluator_v1.py}]
  nison_evidence_aggregate_v1:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pytest pandas
      - run:
          name: Test governed Nison adapters
          command: python -m pytest -q tests/compatibility/test_nison_2025_evidence_aggregate_v1.py tests/compatibility/test_nison_2025_source_adapter_v1.py
  nison_2025_full_production_v1:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas
      - run:
          name: Acquire authoritative 2025 source
          command: |
            set -eu
            mkdir -p /tmp/nison_2025/unpacked
            if [ -n "${NISON_2025_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$NISON_2025_SOURCE_URL" -o /tmp/nison_2025/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/nison_2025/source.zip; else echo 'BLOCKED: configure CircleCI project secret NISON_2025_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            unzip -q /tmp/nison_2025/source.zip -d /tmp/nison_2025/unpacked
            SOURCE_CSV=$(find /tmp/nison_2025/unpacked -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            test -n "$SOURCE_CSV"
            echo "export NISON_SOURCE_CSV=$SOURCE_CSV" >> "$BASH_ENV"
      - run:
          name: Run full governed Nison 2025 production
          command: |
            set -eu
            mkdir -p artifacts/nison_2025
            python OOS_2025/run_nison_2025_full_production_v1.py --input "$NISON_SOURCE_CSV" --output artifacts/nison_2025/NISON_2025_FULL_EVIDENCE.csv --manifest artifacts/nison_2025/NISON_2025_FULL_EVIDENCE_MANIFEST.json
            python OOS_2025/verify_nison_2025_full_production_v1.py artifacts/nison_2025/NISON_2025_FULL_EVIDENCE_MANIFEST.json
      - run:
          name: Aggregate governed Nison evidence
          command: python -c "from OOS_2025.nison_2025_evidence_aggregate_v1 import write_aggregate; write_aggregate('artifacts/nison_2025/NISON_2025_FULL_EVIDENCE.csv','artifacts/nison_2025/NISON_2025_EVIDENCE_BY_TIMESTAMP.csv','artifacts/nison_2025/NISON_2025_EVIDENCE_BY_TIMESTAMP_MANIFEST.json')"
      - store_artifacts:
          path: artifacts/nison_2025
          destination: nison_2025
  oos_2025_78_rule_coverage_v1:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas
      - run:
          name: Acquire authoritative 2025 source
          command: |
            set -eu
            mkdir -p /tmp/nison_2025/unpacked
            if [ -n "${NISON_2025_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$NISON_2025_SOURCE_URL" -o /tmp/nison_2025/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/nison_2025/source.zip; else echo 'BLOCKED: configure CircleCI project secret NISON_2025_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            unzip -q /tmp/nison_2025/source.zip -d /tmp/nison_2025/unpacked
            SOURCE_CSV=$(find /tmp/nison_2025/unpacked -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            test -n "$SOURCE_CSV"
            echo "export NISON_SOURCE_CSV=$SOURCE_CSV" >> "$BASH_ENV"
      - run:
          name: Generate current governed Nison 2025 output
          command: |
            set -eu
            mkdir -p artifacts/oos_78
            python OOS_2025/run_nison_2025_full_production_v1.py --input "$NISON_SOURCE_CSV" --output artifacts/oos_78/NISON_2025_FULL_EVIDENCE.csv --manifest artifacts/oos_78/NISON_2025_FULL_EVIDENCE_MANIFEST.json
      - run:
          name: Build explicit 78-rule coverage report
          command: python OOS_2025/run_current_78_rule_coverage_v1.py --nison-csv artifacts/oos_78/NISON_2025_FULL_EVIDENCE.csv --murphy-snapshot OOS_2025/MURPHY_2025_COVERAGE_SNAPSHOT_V1.json --output artifacts/oos_78/FULL_78_RULE_2025_COVERAGE_CURRENT.json
      - store_artifacts:
          path: artifacts/oos_78
          destination: oos_2025_78_coverage
  murphy_0021_2025_fresh_v1:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Acquire authoritative 2025 H1 + M1 sources
          command: |
            set -eu
            mkdir -p /tmp/murphy_2025_0021/h1 /tmp/murphy_2025_0021/m1
            if [ -n "${NISON_2025_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$NISON_2025_SOURCE_URL" -o /tmp/murphy_2025_0021/h1/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/murphy_2025_0021/h1/source.zip; else echo 'BLOCKED: configure CircleCI project secret NISON_2025_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            if [ -n "${MURPHY_M1_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$MURPHY_M1_SOURCE_URL" -o /tmp/murphy_2025_0021/m1/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_M1_MASTER_2016_2026_V1.zip"}' -o /tmp/murphy_2025_0021/m1/source.zip; else echo 'BLOCKED: configure CircleCI project secret MURPHY_M1_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            unzip -q /tmp/murphy_2025_0021/h1/source.zip -d /tmp/murphy_2025_0021/h1
            unzip -q /tmp/murphy_2025_0021/m1/source.zip -d /tmp/murphy_2025_0021/m1
            H1_CSV=$(find /tmp/murphy_2025_0021/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            M1_CSV=$(find /tmp/murphy_2025_0021/m1 -type f -name '*.csv' | head -1)
            test -n "$H1_CSV"
            test -n "$M1_CSV"
            echo "export MURPHY_SOURCE_CSV=$H1_CSV" >> "$BASH_ENV"
            echo "export MURPHY_M1_SOURCE_CSV=$M1_CSV" >> "$BASH_ENV"
      - run:
          name: Run fresh Murphy 0021 2025 producer
          command: |
            set -eu
            mkdir -p artifacts/murphy_0021_2025
            python OOS_2025/run_murphy_0021_2025_fresh_v1.py --input "$MURPHY_SOURCE_CSV" --m1-input "$MURPHY_M1_SOURCE_CSV" --output artifacts/murphy_0021_2025/MURPHY_0021_2025.csv --manifest artifacts/murphy_0021_2025/MURPHY_0021_MANIFEST.json
      - run:
          name: Verify Murphy 0021 producer tests
          command: python -m pytest -q tests/evaluation/test_murphy_0021_2025_fresh_v1.py
      - store_artifacts:
          path: artifacts/murphy_0021_2025
          destination: murphy_0021_2025
  murphy_0022_0023_2025_pit_v1:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Acquire governed 2025 H1 + M1 sources
          command: |
            set -eu
            mkdir -p /tmp/murphy_0022_0023/h1 /tmp/murphy_0022_0023/m1
            if [ -n "${NISON_2025_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$NISON_2025_SOURCE_URL" -o /tmp/murphy_0022_0023/h1/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/murphy_0022_0023/h1/source.zip; else echo 'BLOCKED: configure CircleCI project secret NISON_2025_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            if [ -n "${MURPHY_M1_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$MURPHY_M1_SOURCE_URL" -o /tmp/murphy_0022_0023/m1/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_M1_MASTER_2016_2026_V1.zip"}' -o /tmp/murphy_0022_0023/m1/source.zip; else echo 'BLOCKED: configure CircleCI project secret MURPHY_M1_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            unzip -q /tmp/murphy_0022_0023/h1/source.zip -d /tmp/murphy_0022_0023/h1
            unzip -q /tmp/murphy_0022_0023/m1/source.zip -d /tmp/murphy_0022_0023/m1
            H1_CSV=$(find /tmp/murphy_0022_0023/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            M1_CSV=$(find /tmp/murphy_0022_0023/m1 -type f -name '*.csv' | head -1)
            test -n "$H1_CSV"
            test -n "$M1_CSV"
            echo "export MURPHY_OI_H1_CSV=$H1_CSV" >> "$BASH_ENV"
            echo "export MURPHY_OI_M1_CSV=$M1_CSV" >> "$BASH_ENV"
      - run:
          name: Run PIT-safe Murphy 0022/0023 on all 2025 H1 rows
          command: |
            set -eu
            mkdir -p artifacts/murphy_0022_0023_2025
            python OOS_2025/run_murphy_0022_0023_2025_pit_v1.py --h1 "$MURPHY_OI_H1_CSV" --m1 "$MURPHY_OI_M1_CSV" --oi evidence/cftc/2025/6b_oi_pit_bound_v1.json --output artifacts/murphy_0022_0023_2025/MURPHY_0022_0023_2025.csv --manifest artifacts/murphy_0022_0023_2025/MURPHY_0022_0023_2025_MANIFEST.json
      - run:
          name: Verify Murphy 0022/0023 runtime and PIT tests
          command: python -m pytest -q tests/evaluation/test_murphy_0021_0023_runtime_dispatch_v1.py tests/evaluation/test_cftc_6b_oi_pit_bound_v1.py
      - store_artifacts:
          path: artifacts/murphy_0022_0023_2025
          destination: murphy_0022_0023_2025
  final_2025_governed_78_rule_v1:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: python -m pip install --upgrade pip pandas pytest
      - run:
          name: Acquire authoritative final OOS H1 + M1 sources
          command: |
            set -eu
            mkdir -p /tmp/final_78/h1 /tmp/final_78/m1
            if [ -n "${NISON_2025_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$NISON_2025_SOURCE_URL" -o /tmp/final_78/h1/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_H1_2016_2025_MASTER.zip"}' -o /tmp/final_78/h1/source.zip; else echo 'BLOCKED: configure CircleCI project secret NISON_2025_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            if [ -n "${MURPHY_M1_SOURCE_URL:-}" ]; then curl -L --fail --silent --show-error "$MURPHY_M1_SOURCE_URL" -o /tmp/final_78/m1/source.zip; elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" -H 'Dropbox-API-Arg: {"path":"/GBPUSD_M1_MASTER_2016_2026_V1.zip"}' -o /tmp/final_78/m1/source.zip; else echo 'BLOCKED: configure CircleCI project secret MURPHY_M1_SOURCE_URL or DROPBOX_ACCESS_TOKEN.'; exit 2; fi
            unzip -q /tmp/final_78/h1/source.zip -d /tmp/final_78/h1
            unzip -q /tmp/final_78/m1/source.zip -d /tmp/final_78/m1
            H1_CSV=$(find /tmp/final_78/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
            M1_CSV=$(find /tmp/final_78/m1 -type f -name '*.csv' | head -1)
            test -n "$H1_CSV"
            test -n "$M1_CSV"
            echo "export FINAL_H1_CSV=$H1_CSV" >> "$BASH_ENV"
            echo "export FINAL_M1_CSV=$M1_CSV" >> "$BASH_ENV"
      - run:
          name: Rebuild governed PIT 0022/0023 source output
          command: |
            set -eu
            mkdir -p artifacts/final_78/pit
            python OOS_2025/run_murphy_0022_0023_2025_pit_v1.py --h1 "$FINAL_H1_CSV" --m1 "$FINAL_M1_CSV" --oi evidence/cftc/2025/6b_oi_pit_bound_v1.json --output artifacts/final_78/pit/MURPHY_0022_0023_2025.csv --manifest artifacts/final_78/pit/MURPHY_0022_0023_2025_MANIFEST.json
      - run:
          name: Run final governed 78-rule Decision Brain and PnL
          command: |
            set -eu
            mkdir -p artifacts/final_78
            python OOS_2025/run_final_2025_governed_78_rule_v1.py --h1 "$FINAL_H1_CSV" --m1 "$FINAL_M1_CSV" --murphy-0022-0023 artifacts/final_78/pit/MURPHY_0022_0023_2025.csv --output-dir artifacts/final_78
      - run:
          name: Verify final 34/44 rule provenance before accepting PnL
          command: |
            set -eu
            python - <<'PY'
            import json
            from pathlib import Path
            p = Path('artifacts/final_78/FINAL_2025_DECISION_EVENTS_MANIFEST.json')
            m = json.loads(p.read_text())
            assert m['murphy_rule_count_in_event'] == 34, m
            assert m['nison_rule_count_in_event'] == 44, m
            assert m['fan_in_mode'] == 'LOSSLESS_FULL_EVIDENCE_WITH_LEGACY_DECISION_COMPAT', m
            print(json.dumps(m, indent=2))
            PY
      - store_artifacts:
          path: artifacts/final_78
          destination: final_2025_governed_78_rule

workflows:
  build_and_test:
    jobs: [nison_runtime_0001_0010, nison_runtime_0011_0020, nison_runtime_0021_0030, nison_runtime_0031_0044, dynamic_mtf_runtime_v1, market_state_contract_v1, market_reader_contract_v1, market_scenario_contract_v1, historical_context_memory_v1, historical_outcome_memory_v1, similarity_memory_v2, memory_integration_v1, outcome_to_scenario_evidence_policy_v1, decision_brain_v1_integration, decision_brain_final_e2e_readiness_v1, risk_execution_runtime_v1, tiz_optional_execution_adapter_v2, decision_brain_pre_oos_freeze_guard_v1, decision_brain_rule_allowlist_v1, rule_adapter_allowlist_runtime_gate_v1, frozen_decision_execution_bridge_v1, frozen_decision_2025_oos_evaluator_contract_v1, three_book_decision_evaluator_v1, nison_evidence_aggregate_v1]
  nison_2025_full_production:
    jobs: [nison_2025_full_production_v1]
  oos_2025_78_rule_coverage:
    jobs: [oos_2025_78_rule_coverage_v1]
  murphy_2025_fresh:
    jobs: [murphy_0021_2025_fresh_v1]
  murphy_0022_0023_2025_pit:
    jobs: [murphy_0022_0023_2025_pit_v1]
  final_2025_governed_78_rule:
    jobs:
      - nison_2025_full_production_v1
      - murphy_0021_2025_fresh_v1
      - murphy_0022_0023_2025_pit_v1
      - oos_2025_78_rule_coverage_v1
      - final_2025_governed_78_rule_v1:
          requires:
            - nison_2025_full_production_v1
            - murphy_0021_2025_fresh_v1
            - murphy_0022_0023_2025_pit_v1
            - oos_2025_78_rule_coverage_v1
