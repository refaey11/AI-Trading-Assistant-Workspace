name: 0006-0007 Deterministic Audit (MANUAL)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install deterministic test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run 0006/0007 deterministic tests
        run: |
          set -euo pipefail
          mkdir -p deterministic_audit
          python -m pytest -q tests/test_murphy_0006_0007_evidence_adapter.py | tee deterministic_audit/pytest.txt
      - name: Collect source-safe evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p deterministic_audit
          date -u '+%Y-%m-%dT%H:%M:%SZ' > deterministic_audit/run_utc.txt
          TZ=Africa/Cairo date '+%Y-%m-%dT%H:%M:%S%z' > deterministic_audit/run_cairo.txt
          git rev-parse HEAD > deterministic_audit/commit.txt
      - name: Upload deterministic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: 0006-0007-deterministic-audit-${{ github.run_number }}
          path: deterministic_audit/
