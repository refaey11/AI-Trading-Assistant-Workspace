name: 0006-0007 Deterministic Audit

on:
  push:
    paths:
      - '.github/workflows/0006-0007-deterministic-audit.yml'
      - 'src/murphy_0006_0007/**'
      - 'tests/test_murphy_0006_0007_evidence_adapter.py'
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: read

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deterministic test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run 0006/0007 deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deterministic_audit
          python -m pytest -q tests/test_murphy_0006_0007_evidence_adapter.py | tee deterministic_audit/pytest.txt

      - name: Collect source-safe evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deterministic_audit
          date -u '+%Y-%m-%dT%H:%M:%SZ' > deterministic_audit/run_utc.txt
          TZ=Africa/Cairo date '+%Y-%m-%dT%H:%M:%S%z' > deterministic_audit/run_cairo.txt
          git rev-parse HEAD > deterministic_audit/commit.txt
          {
            echo '=== TARGET FILES ==='
            find . -type f -not -path './.git/*' | sort | grep -Ei '0006|0007|pivot|geometry|trendline|evaluator|confirmation|contract|adapter' | head -n 1000 || true
            echo '=== CANONICAL KEYWORDS ==='
            git grep -n -I -E 'third_touch|reaction_bounce|no_break|confirmation_available_at|reaction_available_at|TRENDLINE_GEOMETRY_V1|PIVOT_SEQUENCE_V2|NOT_EVALUABLE' -- . ':!.git' | head -n 3000 || true
          } > deterministic_audit/evidence.txt 2>&1
          echo 'OPENAI_DISABLED_FOR_DIAGNOSTIC_RUN' > deterministic_audit/openai_status.txt
          echo 'OpenAI intentionally excluded. This run isolates deterministic CI and 0006/0007 evidence.' > deterministic_audit/README.txt

      - name: Upload deterministic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: 0006-0007-deterministic-audit-${{ github.run_number }}
          path: deterministic_audit/
          if-no-files-found: error
