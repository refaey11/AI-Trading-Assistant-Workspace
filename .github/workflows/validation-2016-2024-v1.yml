name: Validation 2016-2024 v1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_VALIDATION_2016_2024'
        required: true
        type: string

jobs:
  validation:
    if: ${{ inputs.confirm == 'RUN_VALIDATION_2016_2024' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate workflow contract
        run: |
          set -euo pipefail
          test -f tools/gate3c_build_single_event_bundle_v1.py
          test -f OOS_2025/build_single_event_risk_evidence_v1.py
          echo 'VALIDATION_CONTRACT_OK'
          echo 'Scope: 2016-2024 only; no tuning; 2025 excluded.'

      - name: Explain execution boundary
        run: |
          set -euo pipefail
          echo 'NEXT_STEP_READY=2016-2024_BATCH'
          echo 'This launcher intentionally does not modify trading rules, Nison rules, Murphy rules, Decision Brain, or 2025 data.'
          echo 'Batch runner must consume only authoritative existing event/evidence artifacts.'
