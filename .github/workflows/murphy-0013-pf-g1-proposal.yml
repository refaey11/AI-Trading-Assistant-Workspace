name: Murphy 0013 PF-G1 Proposal QA

on:
  pull_request:
    paths:
      - 'src/murphy_0013/**'
      - 'tests/murphy_0013/**'
      - '.github/workflows/murphy-0013-pf-g1-proposal.yml'
  push:
    branches:
      - audit/murphy-0013-geometry-compat-v1

jobs:
  pf-g1-proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run PF-G1 exact-apex tests
        run: python -m pytest -q tests/murphy_0013/test_pf_g1_exact_apex.py
      - name: Run source-bounded breakout-window tests
        run: python -m pytest -q tests/murphy_0013/test_breakout_window_v1.py
