name: Nison 44 Rule Batch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nison-hybrid-44-batch-v1
    paths:
      - 'NISON_GITHUB_SOURCE_SYNC_V1.zip'
      - 'nison_batch/run_nison_44_inventory.py'
      - 'nison_batch/source_map_44.py'
      - '.github/workflows/nison-44-batch.yml'

permissions:
  contents: write
  actions: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f NISON_GITHUB_SOURCE_SYNC_V1.zip
          unzip -t NISON_GITHUB_SOURCE_SYNC_V1.zip
          rm -rf nison_ci_source
          mkdir -p nison_ci_source
          unzip -q NISON_GITHUB_SOURCE_SYNC_V1.zip -d nison_ci_source
          registry="$(find nison_ci_source -type f -name 'INTEGRATED_RULE_REGISTRY_V1.json' -print -quit)"
          test -n "$registry"
          echo "Found Nison registry at: $registry"

      - name: Run source-bounded 44-rule inventory
        shell: bash
        run: |
          set -euo pipefail
          python nison_batch/run_nison_44_inventory.py

      - name: Run source-bounded 44-rule source map
        shell: bash
        run: |
          set -euo pipefail
          python nison_batch/source_map_44.py
          cat nison_batch/artifacts/nison_44_source_map.json

      - name: Governance gate
        shell: bash
        run: |
          set -euo pipefail
          test -f nison_batch/artifacts/nison_44_batch_inventory.json
          test -f nison_batch/artifacts/nison_44_source_map.json
          python - <<'PY'
          import json
          inv=json.load(open('nison_batch/artifacts/nison_44_batch_inventory.json', encoding='utf-8'))
          src=json.load(open('nison_batch/artifacts/nison_44_source_map.json', encoding='utf-8'))
          assert inv['count_check'] is True and inv['nison_rule_count'] == 44
          assert src['count_check'] is True and src['rule_count'] == 44
          assert all(r['decision'] == 'NOT_EVALUABLE' for r in inv['rules'])
          assert all(r['governance']['confirmation_only'] for r in inv['rules'])
          assert all(r['freeze_status'] == 'NOT_FROZEN' for r in src['rules'])
          print('Governance gate PASS: 44 rules inventoried and source-mapped; no invented evaluators/thresholds; no freeze.')
          PY

      - name: Commit source mapping checkpoint on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nison-hybrid-44-batch-v1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nison_batch/artifacts/nison_44_batch_inventory.json nison_batch/artifacts/nison_44_source_map.json
          if git diff --cached --quiet; then
            echo 'No checkpoint changes.'
          else
            git commit -m 'Record Nison 44 source mapping checkpoint'
            git push origin HEAD:feature/nison-hybrid-44-batch-v1
          fi

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nison-44-batch-source-mapping
          path: |
            nison_batch/artifacts/nison_44_batch_inventory.json
            nison_batch/artifacts/nison_44_source_map.json
          retention-days: 30
