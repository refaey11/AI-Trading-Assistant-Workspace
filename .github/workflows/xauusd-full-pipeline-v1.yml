name: XAUUSD Full Pipeline V1

on:
  push:
    branches:
      - prototype/xauusd-evidence-pipeline-v1
    paths:
      - "DEVELOPMENT_2016_2024/**"
      - "BACKTEST/**"
      - "RUNTIME/NISON_EVALUATORS_V1/**"
      - "MURPHY_EVALUATORS_V1/**"
      - ".github/workflows/xauusd-full-pipeline-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "DEVELOPMENT_2016_2024/**"
      - "BACKTEST/**"
      - "RUNTIME/NISON_EVALUATORS_V1/**"
      - "MURPHY_EVALUATORS_V1/**"
      - ".github/workflows/xauusd-full-pipeline-v1.yml"

jobs:
  xauusd-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas pytest
      - run: python -m py_compile DEVELOPMENT_2016_2024/run_xauusd_full_pipeline_v1.py DEVELOPMENT_2016_2024/run_xauusd_murphy_evidence_v1.py DEVELOPMENT_2016_2024/xauusd_murphy_0006_0007_runtime_evidence_v1.py
      - run: PYTHONPATH=. pytest -q DEVELOPMENT_2016_2024/test_xauusd_murphy_evidence_v1.py DEVELOPMENT_2016_2024/test_xauusd_full_pipeline_v1.py
      - run: test -n 0 >/dev/null 2>&1 || true
      - run: PYTHONPATH=. python DEVELOPMENT_2016_2024/run_xauusd_full_pipeline_v1.py --output-dir XAUUSD_FULL_PIPELINE_2016_2024
      - name: Upload XAUUSD full pipeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_FULL_PIPELINE_2016_2024
          path: XAUUSD_FULL_PIPELINE_2016_2024
          if-no-files-found: warn
