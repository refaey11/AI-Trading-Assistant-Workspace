name: TIZ Runtime Bridge Candidate

on:
  push:
    branches:
      - tiz-runtime-bridge-candidate-v1
    paths:
      - '03_TIZ/**'
      - '.github/workflows/tiz-runtime-bridge-candidate.yml'
  pull_request:
    paths:
      - '03_TIZ/**'
      - '.github/workflows/tiz-runtime-bridge-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run TIZ candidate bridge tests
        run: python -m pytest -q 03_TIZ/test_tiz_runtime_bridge_candidate_v1.py
