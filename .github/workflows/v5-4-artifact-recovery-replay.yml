name: V5.4 Artifact Recovery Replay

on:
  push:
    branches:
      - feature/edge-discovery-ledger-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/OOS_2025
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/edge-discovery-ledger-v1
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Recover governed source artifact by exact name
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34672341981
          name: current-stack-development-backtest-2016-2024-v5-4
          path: artifacts
          merge-multiple: false
      - name: Verify recovered source set
        run: |
          set -euo pipefail
          test -f artifacts/source/h1/GBPUSD_H1_2016_2025_MASTER.csv
          test -f artifacts/source/nison.csv
          test -f artifacts/source/market_state.csv
          test -f artifacts/source/memory/historical_context/HISTORICAL_CONTEXT_MEMORY.csv
          test -f artifacts/source/memory/historical_outcome/HISTORICAL_OUTCOMES.csv
          test -f artifacts/source/memory/similarity/SIMILAR_CONTEXT_READS.json
          test -f artifacts/source/memory/retrieval/CONTEXT_AWARE_READINGS.json
          test -f artifacts/source/memory/scenario/MARKET_SCENARIOS.json
          test -f artifacts/source/MTF_COVERAGE_REPORT.json || true
          if test -f artifacts/source/MURPHY_CURRENT_STACK.csv; then
            cp artifacts/source/MURPHY_CURRENT_STACK.csv artifacts/source/MURPHY_CURRENT_STACK.csv
          elif test -f artifacts/source/murphy/MURPHY_2016_2024_FULL_EVIDENCE.csv; then
            cp artifacts/source/murphy/MURPHY_2016_2024_FULL_EVIDENCE.csv artifacts/source/MURPHY_CURRENT_STACK.csv
          else
            echo 'MISSING_MURPHY_SOURCE'
            exit 1
          fi
          if test -f artifacts/source/MTF_CURRENT_STACK.csv; then
            cp artifacts/source/MTF_CURRENT_STACK.csv artifacts/source/MTF_CURRENT_STACK.csv
          elif find artifacts/source -type f -name '*MTF*csv' | grep -q .; then
            find artifacts/source -type f -name '*MTF*csv' | head -1 | xargs -I{} cp {} artifacts/source/MTF_CURRENT_STACK.csv
          else
            echo 'MISSING_MTF_SOURCE'
            exit 1
          fi
          echo RECOVERED_SOURCE_SET_PASS
      - name: Enforce development window
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          assert datetime(2016,1,1,tzinfo=timezone.utc) < datetime(2025,1,1,tzinfo=timezone.utc)
          print('DEVELOPMENT_WINDOW=2016-2024')
          print('2025_OOS_LOCKED=True')
          PY
      - name: Run V5.4 full-window replay
        run: |
          set -euo pipefail
          H1=artifacts/source/h1/GBPUSD_H1_2016_2025_MASTER.csv
          HC=artifacts/source/memory/historical_context/HISTORICAL_CONTEXT_MEMORY.csv
          HO=artifacts/source/memory/historical_outcome/HISTORICAL_OUTCOMES.csv
          SIM=artifacts/source/memory/similarity/SIMILAR_CONTEXT_READS.json
          RET=artifacts/source/memory/retrieval/CONTEXT_AWARE_READINGS.json
          SCN=artifacts/source/memory/scenario/MARKET_SCENARIOS.json
          mkdir -p artifacts/current_stack_backtest_2016_2024
          python DEVELOPMENT_2016_2024/current_stack_historical_replay_v5_4.py \
            --h1 "$H1" --market-state artifacts/source/market_state.csv \
            --murphy artifacts/source/MURPHY_CURRENT_STACK.csv --nison artifacts/source/nison.csv \
            --mtf artifacts/source/MTF_CURRENT_STACK.csv --historical-context "$HC" \
            --historical-outcome "$HO" --similarity-artifact "$SIM" \
            --retrieval-artifact "$RET" --scenario-artifact "$SCN" \
            --output-dir artifacts/current_stack_backtest_2016_2024
      - name: Print V5.4 metrics
        run: cat artifacts/current_stack_backtest_2016_2024/current_stack_backtest_metrics_2016_2024.json
      - name: Upload V5.4 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-4-final-result
          path: artifacts/current_stack_backtest_2016_2024
          if-no-files-found: ignore

# Recovery path uses the already-acquired governed source artifact; 2025 remains locked.
# Trigger refresh commit forces the replay workflow to execute against the governed source.
