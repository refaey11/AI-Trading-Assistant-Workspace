name: Nison Runtime 0001-0010

on:
  push:
    paths:
      - '.github/workflows/nison-runtime-0001-0010.yml'
      - 'RUNTIME/NISON_EVALUATORS_V1/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nison-runtime-0001-0010.yml'
      - 'RUNTIME/NISON_EVALUATORS_V1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nison-runtime-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Nison unit tests 0001-0010
        working-directory: RUNTIME/NISON_EVALUATORS_V1
        run: |
          set -euo pipefail
          python -m pytest -q test_nison_0001_0002_engulfing.py test_nison_0003_0010_runtime.py
      - name: Run unified router smoke 0001-0010
        working-directory: RUNTIME/NISON_EVALUATORS_V1
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from nison_0001_0010_router import evaluate_rule
          cases = {
            'CANDLE_RULE_0001': {'candles':[{'open':10.0,'high':10.5,'low':9.5,'close':9.7},{'open':9.6,'high':11.0,'low':9.5,'close':10.8}], 'context':{'trend':'Downtrend'}, 'confirmation':{'break_above_engulfing_high':True}},
            'CANDLE_RULE_0002': {'candles':[{'open':10.0,'high':10.5,'low':9.5,'close':10.3},{'open':10.4,'high':10.5,'low':9.0,'close':9.2}], 'context':{'trend':'Uptrend'}, 'confirmation':{'break_below_engulfing_low':True}},
          }
          for rid, payload in cases.items():
              out = evaluate_rule(rid, payload)
              assert out['status'] == 'PASS', (rid, out)
          print('Router smoke PASS for 0001-0002')
          PY
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nison-runtime-0001-0010-${{ github.run_number }}
          path: RUNTIME/NISON_EVALUATORS_V1/
          retention-days: 14