name: Decision Brain Paper 2025 OOS V2
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feat/paper-trading-bot-v1]
permissions:
  contents: read
env:
  DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
jobs:
  paper-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas
      - name: Acquire frozen 2025 sources
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          test -n "$TOKEN"
          mkdir -p artifacts/source/h1
          dl(){ curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${TOKEN}" -H "Dropbox-API-Arg: {\"path\":\"$1\"}" -o "$2"; }
          dl "/New/MURPHY_2025_FULL_EVIDENCE.csv" artifacts/source/murphy_2025.csv
          dl "/New/NISON_2025_FULL_EVIDENCE 3.csv" artifacts/source/nison_2025.csv
          dl "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_MARKET_STATE_READER_V1/GBPUSD_MARKET_STATE.csv" artifacts/source/market_state.csv
          dl "/New 8/GBPUSD_H1_2016_2025_MASTER.zip" artifacts/source/h1.zip
          unzip -q artifacts/source/h1.zip -d artifacts/source/h1
      - name: Resolve and validate sources
        shell: bash
        run: |
          set -euo pipefail
          H1=$(find artifacts/source/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
          test -n "$H1"
          test -s artifacts/source/murphy_2025.csv
          test -s artifacts/source/nison_2025.csv
          test -s artifacts/source/market_state.csv
          echo "H1=$H1" >> "$GITHUB_ENV"
          python - <<'PY'
          import pandas as pd
          for p in ['artifacts/source/murphy_2025.csv','artifacts/source/nison_2025.csv']:
              d=pd.read_csv(p,usecols=['timestamp'],low_memory=False)
              t=pd.to_datetime(d.timestamp,utc=True,errors='coerce',format='mixed')
              assert t.notna().all() and set(t.dt.year)=={2025}
          print('OOS_2025_SOURCE_BOUNDARY_PASS')
          PY
      - name: Diagnose Decision Brain wiring
        run: |
          python OOS_2025/DIAGNOSTIC_MARKET_STATE_SCHEMA_V1.py --context artifacts/source/market_state.csv
      - name: Run governed paper evaluation
        run: |
          python OOS_2025/DECISION_BRAIN_PAPER_RUNNER_2025_V1.py --h1 "$H1" --murphy artifacts/source/murphy_2025.csv --nison artifacts/source/nison_2025.csv --context artifacts/source/market_state.csv --out artifacts/decision_brain_paper_2025
      - name: Print execution funnel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          m=json.loads(Path('artifacts/decision_brain_paper_2025/metrics_2025.json').read_text())
          d=pd.read_csv('artifacts/decision_brain_paper_2025/decision_events_2025.csv')
          print(json.dumps(m,indent=2))
          print('EVENTS',len(d))
          print('MURPHY_DIRECTIONAL',int(d.murphy_direction.isin(['BULLISH','BEARISH']).sum()))
          print('BRAIN_DIRECTIONAL',int(d.brain_bias.isin(['BULLISH','BEARISH']).sum()))
          print('BRAIN_ALIGNED',int(((d.murphy_direction==d.brain_bias)&d.murphy_direction.isin(['BULLISH','BEARISH'])).sum()))
          print('NISON_CONTRADICTION',int(d.nison_contradiction.sum()))
          print('EXECUTE',int(d.decision.eq('EXECUTE').sum()))
          PY
      - name: Enforce frozen evaluation policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/decision_brain_paper_2025/metrics_2025.json').read_text())
          assert m['window']=='2025-only'
          assert m['stop_atr']==0.75 and m['target_R']==2.0
          assert m['entry_policy']=='next_h1_open'
          assert m['nison_absent_is_allowed'] and m['nison_fail_is_not_contradiction']
          assert not m['future_data_used'] and not m['tuning_applied'] and not m['live_execution'] and not m['official_profitability_claim']
          print(json.dumps(m,indent=2))
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-brain-paper-2025-oos-v2
          path: artifacts/decision_brain_paper_2025
          if-no-files-found: ignore
