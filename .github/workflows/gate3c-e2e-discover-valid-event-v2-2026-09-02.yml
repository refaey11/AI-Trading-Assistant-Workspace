name: Gate 3C E2E Discover Valid Event V2 2026-09-02

on:
  push:
    branches:
      - diagnostic/mtf-gate-observable-2026-09-02
      - diagnostic/murphy-34-recovery-2026-09-02
  pull_request:
    branches:
      - current-stack-dev-backtest-2016-2024-v3

permissions:
  contents: read

env:
  DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
  EQUITY: "10000"
  PEAK_EQUITY: "10000"
  PRIOR_LOSS_STREAK: "0"

jobs:
  gate3c-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Acquire governed source data
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          test -n "$TOKEN"
          mkdir -p /tmp/gate3c/source /tmp/gate3c/unpacked
          download(){
            curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Dropbox-API-Arg: {\"path\":\"$1\"}" \
              -o "$2"
          }
          download "/New 8/GBPUSD_H1_2016_2025_MASTER.zip" /tmp/gate3c/source/h1.zip
          download "/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip" /tmp/gate3c/source/murphy.zip
          download "/MTF_ALIGNMENT_GBPUSD_V1.zip" /tmp/gate3c/source/mtf.zip
          download "/New 8/GBPUSD_MARKET_STATE 6.csv" /tmp/gate3c/source/market_state.csv
          download "/New 8/NISON_2016_2024_FULL_EVIDENCE.csv" /tmp/gate3c/source/nison.csv
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_CONTEXT_MEMORY_V1.zip" /tmp/gate3c/source/hc.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_OUTCOME_MEMORY_V1.zip" /tmp/gate3c/source/ho.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_SIMILARITY_MEMORY_V2.zip" /tmp/gate3c/source/similarity.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_CONTEXT_AWARE_RETRIEVAL_V2.zip" /tmp/gate3c/source/retrieval.zip
          for z in h1 murphy mtf hc ho similarity retrieval; do unzip -q "/tmp/gate3c/source/${z}.zip" -d "/tmp/gate3c/unpacked/${z}"; done

      - name: Discover first valid source-backed event (optimized)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/gate3c')
          murphy_path = sorted((root/'unpacked'/'murphy').rglob('MURPHY_2016_2024_FULL_EVIDENCE.csv'))[0]
          h1_path = sorted((root/'unpacked'/'h1').rglob('GBPUSD_H1_2016_2025_MASTER.csv'))[0]
          mtf_candidates = [p for p in sorted((root/'unpacked'/'mtf').rglob('*.csv')) if 'GBPUSD' in p.name.upper() or 'MTF' in p.name.upper()]
          if not mtf_candidates: raise SystemExit('DISCOVERY_NO_MTF_CANONICAL_CSV')
          mtf_path = mtf_candidates[0]

          murphy = pd.read_csv(murphy_path, low_memory=False)
          h1 = pd.read_csv(h1_path, low_memory=False)
          market = pd.read_csv(root/'source'/'market_state.csv', low_memory=False)
          nison = pd.read_csv(root/'source'/'nison.csv', low_memory=False)
          mtf = pd.read_csv(mtf_path, low_memory=False)

          required_mtf = ['mtf_trend_score','M5_trend_regime','M15_trend_regime','M30_trend_regime','H1_trend_regime','H4_trend_regime','D1_trend_regime']
          expected_nison = {f'NISON_{i:04d}' for i in range(1,45)}
          for df, name in [(murphy,'murphy'),(h1,'h1'),(market,'market'),(nison,'nison'),(mtf,'mtf')]:
              if 'timestamp' not in df.columns: raise SystemExit(f'DISCOVERY_MISSING_TIMESTAMP:{name}')
              df['timestamp'] = pd.to_datetime(df['timestamp'], utc=True, errors='coerce', format='mixed')

          # 1) Reduce Murphy to unique directional PASS events, preserving source-backed direction.
          murphy['status_norm'] = murphy.get('status','').astype(str).str.upper().str.strip()
          murphy['direction_norm'] = murphy.get('direction','').astype(str).str.upper().str.strip().replace({'BULLISH':'BUY','BEARISH':'SELL'})
          m = murphy.loc[
              murphy['timestamp'].notna()
              & murphy['timestamp'].dt.year.between(2016, 2024)
              & murphy['status_norm'].eq('PASS')
              & murphy['direction_norm'].isin({'BUY','SELL'}),
              ['timestamp','direction_norm','source_rule_id']
          ].copy()
          if m.empty: raise SystemExit('DISCOVERY_NO_DIRECTIONAL_MURPHY_PASS_ROWS')
          m['source_rule_id'] = m['source_rule_id'].astype(str)
          event_counts = m.groupby('timestamp', sort=False).agg(
              directional_rows=('direction_norm','size'),
              direction_nunique=('direction_norm','nunique'),
          ).reset_index()
          valid_m = event_counts.loc[
              event_counts['directional_rows'].eq(1) & event_counts['direction_nunique'].eq(1),
              ['timestamp']
          ]
          m = m.merge(valid_m, on='timestamp', how='inner').sort_values('timestamp')

          # 2) Require exactly one H1 and one market-state row by timestamp.
          h1_counts = h1.groupby('timestamp').size().rename('h1_count')
          market_counts = market.groupby('timestamp').size().rename('market_count')
          nison_counts = nison.groupby('timestamp').agg(
              nison_rows=('source_rule_id','size') if 'source_rule_id' in nison.columns else ('timestamp','size'),
              nison_ids=('source_rule_id','nunique') if 'source_rule_id' in nison.columns else ('timestamp','size'),
          )
          candidates = m[['timestamp','direction_norm']].drop_duplicates('timestamp')
          candidates = candidates.join(h1_counts, on='timestamp').join(market_counts, on='timestamp').join(nison_counts, on='timestamp')
          candidates = candidates.loc[
              candidates['h1_count'].eq(1)
              & candidates['market_count'].eq(1)
              & candidates['nison_rows'].eq(44)
              & candidates['nison_ids'].eq(44)
          ]
          if candidates.empty: raise SystemExit('DISCOVERY_NO_EVENT_WITH_H1_MARKET_NISON')

          # 3) Source-backed MTF as-of join. No fill, translation or scaling.
          mtf = mtf.sort_values('timestamp')
          for col in required_mtf:
              if col not in mtf.columns: raise SystemExit(f'DISCOVERY_MTF_FIELD_MISSING:{col}')
          left = candidates[['timestamp','direction_norm']].sort_values('timestamp')
          right = mtf[['timestamp'] + required_mtf].dropna(subset=['timestamp']).drop_duplicates('timestamp', keep='last')
          joined = pd.merge_asof(left, right, on='timestamp', direction='backward', allow_exact_matches=True)
          joined = joined.dropna(subset=required_mtf)
          if joined.empty: raise SystemExit('DISCOVERY_NO_EVENT_WITH_SOURCE_BACKED_MTF')

          chosen = joined.iloc[0]
          ts = pd.Timestamp(chosen['timestamp']).tz_convert('UTC')
          print('DISCOVERED_EVENT_TS', ts.isoformat())
          print('DISCOVERED_MURPHY_DIRECTION', chosen['direction_norm'])
          print('DISCOVERY_MTF_SOURCE_ASOF', ts.isoformat())
          with open('/tmp/gate3c/event.env','w',encoding='utf-8') as f:
              f.write(f'EVENT_TS={ts.isoformat()}\n')
          PY
          cat /tmp/gate3c/event.env >> "$GITHUB_ENV"

      - name: Validate discovered event window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          ts=datetime.fromisoformat(os.environ['EVENT_TS']).astimezone(timezone.utc)
          if not (datetime(2016,1,1,tzinfo=timezone.utc) <= ts < datetime(2025,1,1,tzinfo=timezone.utc)):
              raise SystemExit('FAIL_CLOSED_EVENT_OUTSIDE_2016_2024')
          print('EVENT_TS_OK', ts.isoformat())
          PY

      - name: Build event slices and canonical bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,pandas as pd
          ts=pd.Timestamp(os.environ['EVENT_TS'],tz='UTC'); root=Path('/tmp/gate3c')
          def exact_one(src,dst):
              df=pd.read_csv(src,low_memory=False)
              if 'timestamp' not in df.columns: raise SystemExit(f'BLOCKED_TIMESTAMP_COLUMN_MISSING:{src}')
              parsed=pd.to_datetime(df['timestamp'],utc=True,errors='coerce',format='mixed')
              part=df.loc[parsed.eq(ts)].copy()
              if len(part)!=1: raise SystemExit(f'BLOCKED_EVENT_ROW_COUNT:{src}:{len(part)}')
              part.to_csv(dst,index=False)
          exact_one(root/'source'/'market_state.csv',root/'event_context.csv')
          h=list((root/'unpacked'/'h1').rglob('GBPUSD_H1_2016_2025_MASTER.csv'))
          if not h: raise SystemExit('BLOCKED_H1_MASTER_CSV_NOT_FOUND')
          exact_one(h[0],root/'event_h1.csv')
          nison=root/'source'/'nison.csv'; ndf=pd.read_csv(nison,low_memory=False)
          if 'source_rule_id' not in ndf.columns:
              if 'rule_id' in ndf.columns: ndf=ndf.rename(columns={'rule_id':'source_rule_id'})
              else: raise SystemExit('BLOCKED_NISON_SCHEMA')
          ndf['timestamp']=pd.to_datetime(ndf['timestamp'],utc=True,errors='coerce',format='mixed')
          part=ndf.loc[ndf['timestamp'].eq(ts)].copy()
          ids={str(x) for x in part['source_rule_id'].tolist()}
          expected={f'NISON_{i:04d}' for i in range(1,45)}
          if len(part)!=44 or ids!=expected: raise SystemExit(f'BLOCKED_NISON_44_FANIN:{len(part)}:{len(ids)}')
          part.to_csv(root/'event_nison.csv',index=False)
          print('SOURCE_SLICES_READY',ts.isoformat())
          PY
          python OOS_2025/build_single_event_risk_evidence_v1.py \
            --timestamp "$EVENT_TS" \
            --h1 /tmp/gate3c/event_h1.csv \
            --market-state /tmp/gate3c/event_context.csv \
            --murphy-root /tmp/gate3c/unpacked/murphy \
            --output /tmp/gate3c/unpacked/retrieval/gate3c_risk_evidence.csv \
            --equity "$EQUITY" --peak-equity "$PEAK_EQUITY" --prior-loss-streak "$PRIOR_LOSS_STREAK"
          python tools/gate3c_build_single_event_bundle_v1.py \
            --timestamp "$EVENT_TS" \
            --h1 /tmp/gate3c/event_h1.csv \
            --market-state /tmp/gate3c/event_context.csv \
            --nison /tmp/gate3c/event_nison.csv \
            --murphy-root /tmp/gate3c/unpacked/murphy \
            --mtf-root /tmp/gate3c/unpacked/mtf \
            --historical-context-root /tmp/gate3c/unpacked/hc \
            --historical-outcome-root /tmp/gate3c/unpacked/ho \
            --similarity-root /tmp/gate3c/unpacked/similarity \
            --retrieval-root /tmp/gate3c/unpacked/retrieval \
            --output /tmp/gate3c/canonical_event.json

      - name: Run real single-event E2E
        run: |
          set +e
          python RUNTIME/DECISION_RUNTIME_V1/gate3c_single_event_e2e_v1.py \
            --event /tmp/gate3c/canonical_event.json \
            --output /tmp/gate3c/gate3c_result.json
          rc=$?
          cat /tmp/gate3c/gate3c_result.json || true
          echo "GATE3C_PROCESS_EXIT=$rc"
          exit "$rc"

      - name: Contract audit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/gate3c/gate3c_result.json')
          if not p.exists(): raise SystemExit('NO_GATE3C_RESULT')
          r=json.loads(p.read_text())
          print('GATE3C_STATUS',r.get('gate3c'))
          print('QUERY_AS_OF',r.get('query_as_of'))
          print('BRAIN_STATUS',(r.get('brain_execution_result') or {}).get('status'))
          print('MTF',r.get('mtf'))
          print('RISK',r.get('risk'))
          print('DECISION_TRACE',r.get('decision_trace'))
          if r.get('query_as_of','').startswith('2025'): raise SystemExit('OOS_2025_EVENT_FORBIDDEN')
          if r.get('governance',{}).get('future_data_allowed') is not False: raise SystemExit('FUTURE_DATA_POLICY_VIOLATION')
          PY

      - name: Upload Gate 3C result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3c-discovered-valid-event-v2-result
          path: /tmp/gate3c/gate3c_result.json
          if-no-files-found: ignore
