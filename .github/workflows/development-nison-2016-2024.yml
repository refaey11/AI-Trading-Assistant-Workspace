name: Development Nison 2016-2024

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nison-development-2016-2024:
    runs-on: ubuntu-latest
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Verify Dropbox secret is configured
        run: test -n "$DROPBOX_ACCESS_TOKEN"
      - name: Verify repository Python imports
        run: python -c "import OOS_2025; import DEVELOPMENT_2016_2024.run_nison_development_2016_2024_v1"
      - name: Recover and run governed Nison development evidence
        run: |
          set -eu
          mkdir -p artifacts/development_nison_2016_2024
          python DEVELOPMENT_2016_2024/run_nison_development_2016_2024_v1.py \
            --output-dir artifacts/development_nison_2016_2024
      - name: Store development evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: development-nison-2016-2024
          path: artifacts/development_nison_2016_2024
