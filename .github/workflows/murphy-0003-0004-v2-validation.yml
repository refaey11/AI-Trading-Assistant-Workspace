name: Murphy 0003-0004 V2 Validation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Workspace backup release tag
        required: true
        default: workspace-v1
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download workspace backup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p parts workspace
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_*.zip.part' --dir parts
          cat parts/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_01_OF_03.zip.part \
              parts/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_02_OF_03.zip.part \
              parts/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_03_OF_03.zip.part > workspace-full.zip
          unzip -q workspace-full.zip -d workspace

      - name: Validate evaluator and alignment contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest pandas
          cp audits/MURPHY_0003_0004_EVALUATOR_V2/murphy_0003_0004_evaluator_v2.py /tmp/murphy_0003_0004_evaluator_v2.py
          cp audits/MURPHY_0003_0004_EVALUATOR_V2/test_murphy_0003_0004_evaluator_v2.py /tmp/test_murphy_0003_0004_evaluator_v2.py
          cd /tmp
          pytest -q test_murphy_0003_0004_evaluator_v2.py
          cd -
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('audits/MURPHY_0003_0004_EVALUATOR_V2/MURPHY_0003_0004_AVAILABILITY_ALIGNMENT_CONTRACT_V1.json')
          contract = json.loads(path.read_text())
          assert contract['rule_scope'] == ['MURPHY_0003', 'MURPHY_0004']
          assert contract['source'] == 'PIVOT_SEQUENCE_V2_OUTPUT'
          assert contract['evaluation_period'] == {'start_year': 2016, 'end_year': 2024, 'exclude_year': 2025}
          assert contract['pivot_requirement'] == 'CONFIRMED_AFTER_2_BARS'
          assert contract['availability_rule'] == 'Only pivot evidence whose availability_timestamp is <= evaluation_availability_timestamp may be used.'
          assert contract['sequence_rule']['0003'] == 'current reaction peak > prior reaction peak AND current reaction trough > prior reaction trough'
          assert contract['sequence_rule']['0004'] == 'current reaction peak < prior reaction peak AND current reaction trough < prior reaction trough'
          assert contract['peak_selection'] == 'At evaluation time, use the two latest confirmed HIGH pivots available by availability_timestamp.'
          assert contract['trough_selection'] == 'Evaluate the current confirmed LOW against the immediately preceding confirmed LOW in chronological pivot order.'
          assert contract['lookahead_policy'] == 'No future pivot may participate before its confirmation availability timestamp.'
          assert contract['missing_evidence'] == 'Return NOT_EVALUABLE when either required side of the sequence is unavailable.'
          assert contract['tuning_policy'] == 'No thresholds or pivot-generation parameters may be tuned from 2025 or from the evaluation outputs.'
          assert contract['freeze_gate'] == 'Contract, implementation, unit tests, and 2016-2024 historical rerun must all pass before marking 0003-0004 production-frozen.'
          print(f"Alignment contract assertions passed: {contract['contract_id']} ({contract['status']})")
          PY

      - name: Historical 2016-2024 exact rerun
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import os
          import re
          import numpy as np
          import pandas as pd

          base = 'workspace/PIVOT_SEQUENCE_V2_OUTPUT'
          pattern = re.compile(r'^GBPUSD_(D1|H1|H4|M15|M30|M5)(?:_(\d{4}))?_STRUCTURE_PIVOT_SEQUENCE_V2\.csv$')
          candidates = {tf: {'annual': [], 'unsuffixed': []} for tf in ('D1','H1','H4','M15','M30','M5')}

          for f in sorted(glob.glob(base + '/*_STRUCTURE_PIVOT_SEQUENCE_V2.csv')):
              bn = os.path.basename(f)
              m = pattern.match(bn)
              if not m:
                  continue
              tf, year = m.group(1), m.group(2)
              candidates[tf]['annual' if year else 'unsuffixed'].append(f)

          selected = {}
          for tf, sets in candidates.items():
              # Never concatenate a full-history file with annual shards: that double-counts events.
              # Prefer annual shards when they exist; otherwise use the single unsuffixed canonical file.
              if sets['annual']:
                  selected[tf] = sorted(sets['annual'])
              elif sets['unsuffixed']:
                  if len(sets['unsuffixed']) != 1:
                      raise SystemExit(f'Ambiguous canonical files for {tf}: {sets["unsuffixed"]}')
                  selected[tf] = sets['unsuffixed']
              else:
                  selected[tf] = []

          missing = [tf for tf, files in selected.items() if not files]
          if missing:
              raise SystemExit(f'Missing canonical Pivot Sequence V2 files for: {missing}')

          with open('murphy_0003_0004_file_selection.txt', 'w') as s:
              for tf in sorted(selected):
                  s.write(f'{tf}\n')
                  for f in selected[tf]:
                      s.write(f'  {f}\n')
          print(open('murphy_0003_0004_file_selection.txt').read())

          out = []
          for tf in sorted(selected):
              dfs = []
              for f in selected[tf]:
                  df = pd.read_csv(f, usecols=['pivot_timestamp', 'pivot_type', 'pivot_price', 'availability_timestamp'])
                  df['pivot_timestamp'] = pd.to_datetime(df['pivot_timestamp'])
                  df['availability_timestamp'] = pd.to_datetime(df['availability_timestamp'])
                  dfs.append(df)

              df = pd.concat(dfs, ignore_index=True)
              df = df[(df.pivot_timestamp.dt.year >= 2016) & (df.pivot_timestamp.dt.year <= 2024)]
              # Canonical identity guard: duplicate pivot rows are not allowed into the evaluation population.
              key = ['pivot_timestamp', 'pivot_type', 'pivot_price', 'availability_timestamp']
              dup = int(df.duplicated(key).sum())
              if dup:
                  raise SystemExit(f'{tf}: {dup} duplicate canonical pivot rows detected after file selection')

              df = df.sort_values('pivot_timestamp')
              lows = df[df.pivot_type == 'LOW'].sort_values('pivot_timestamp').reset_index(drop=True)
              highs = df[df.pivot_type == 'HIGH'].sort_values('availability_timestamp').reset_index(drop=True)
              h_av = highs.availability_timestamp.values.astype('datetime64[ns]')
              h_price = highs.pivot_price.values
              n = p3 = p4 = 0
              for i in range(1, len(lows)):
                  r = lows.iloc[i]
                  idx = np.searchsorted(h_av, r.availability_timestamp.to_datetime64(), side='right')
                  if idx < 2:
                      continue
                  cp, pp = h_price[idx - 1], h_price[idx - 2]
                  ct, pt = r.pivot_price, lows.iloc[i - 1].pivot_price
                  n += 1
                  p3 += int(cp > pp and ct > pt)
                  p4 += int(cp < pp and ct < pt)
              out.append((tf, n, p3, p4))

          if len(out) != 6:
              raise SystemExit(f'Expected 6 timeframes, found {len(out)}')

          with open('murphy_0003_0004_historical_v2.csv', 'w') as f:
              f.write('timeframe,evaluable_events,murphy_0003_pass,murphy_0004_pass\n')
              for r in out:
                  f.write(','.join(map(str, r)) + '\n')

          print(open('murphy_0003_0004_historical_v2.csv').read())
          PY

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: murphy-0003-0004-v2-validation-${{ inputs.release_tag }}
          path: |
            murphy_0003_0004_historical_v2.csv
            murphy_0003_0004_file_selection.txt
          retention-days: 30
