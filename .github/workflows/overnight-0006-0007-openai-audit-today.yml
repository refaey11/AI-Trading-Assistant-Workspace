name: Overnight 0006-0007 OpenAI Audit - Today

# Active today-only audit window: 06:00–14:00 Cairo.
# The audit must never lose deterministic evidence because OpenAI is rate-limited.

on:
  push:
    paths:
      - '.github/workflows/overnight-0006-0007-openai-audit-today.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check requested time window
        shell: bash
        run: |
          set -euo pipefail
          NOW_UTC=$(date -u +%s)
          START=$(date -u -d '2026-08-14T03:00:00Z' +%s)
          CUTOFF=$(date -u -d '2026-08-14T11:05:00Z' +%s)
          if [ "$NOW_UTC" -lt "$START" ] || [ "$NOW_UTC" -ge "$CUTOFF" ]; then
            echo 'Outside the requested 06:00–14:00 Cairo window; clean exit.'
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p overnight_audit
          date -u '+%Y-%m-%dT%H:%M:%SZ' > overnight_audit/run_utc.txt
          TZ=Africa/Cairo date '+%Y-%m-%dT%H:%M:%S%z' > overnight_audit/run_cairo.txt
          git rev-parse HEAD > overnight_audit/commit.txt
          {
            echo '=== FILES ==='
            find . -type f -not -path './.git/*' | sort | grep -Ei '0006|0007|pivot|geometry|trendline|evaluator|confirmation|adapter|contract' | head -n 500 || true
            echo '=== KEYWORDS ==='
            git grep -n -I -E 'third_touch|reaction_bounce|no_break|confirmation_available_at|reaction_available_at|TRENDLINE_GEOMETRY_V1|PIVOT_SEQUENCE_V2|NOT_EVALUABLE' -- . ':!overnight_audit' | head -n 1600 || true
          } > overnight_audit/evidence.txt
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -d tests ]; then
            python -m pytest -q > overnight_audit/pytest.txt 2>&1 || true
          else
            echo 'No pytest project detected.' > overnight_audit/pytest.txt
          fi

      - name: OpenAI forensic analysis (resilient)
        shell: bash
        run: |
          set -u
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            cat > overnight_audit/openai_report.md <<'EOF'
          STATUS: OPENAI_NOT_CONFIGURED

          Deterministic audit completed. No OpenAI analysis was attempted because
          OPENAI_API_KEY is unavailable to this GitHub Actions job.
          EOF
            exit 0
          fi

          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          evidence = Path('overnight_audit/evidence.txt').read_text(errors='ignore')[:120000]
          tests = Path('overnight_audit/pytest.txt').read_text(errors='ignore')[:40000]
          prompt = f'''You are the forensic integration auditor for the AI Trading Assistant project.

Target: Murphy 0006/0007 only.
Use ONLY repository evidence below. Do not invent fields, thresholds, tolerances, lookbacks, or evidence. Do not use 2025 for tuning or selection. Do not declare Production Frozen. Do not rebuild Pivot or Geometry unless evidence proves the canonical component is missing.

Check this lineage:
PIVOT_SEQUENCE_V2 -> TRENDLINE_GEOMETRY_V1 -> third_touch -> reaction -> no_break -> availability -> 0006/0007 evaluator.

Classify every link: PROVEN / DOWNSTREAM_ONLY / MISSING / CONTRADICTORY.

Return:
VERDICT: PROVEN / NOT_PROVEN / BLOCKED
LINKAGE TABLE
EXACT BLOCKER(S)
SMALLEST SAFE NEXT ACTION
FREEZE REVIEW: READY / NOT_READY

Repository evidence:
{evidence}

Test output:
{tests}
'''

          body = json.dumps({'model': 'gpt-5', 'input': prompt, 'store': False}).encode()
          headers = {
              'Authorization': 'Bearer ' + os.environ['OPENAI_API_KEY'],
              'Content-Type': 'application/json',
          }

          last_error = None
          for attempt in range(1, 6):
              try:
                  req = urllib.request.Request(
                      'https://api.openai.com/v1/responses',
                      data=body,
                      headers=headers,
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data = json.load(r)
                  text = data.get('output_text', '')
                  if not text:
                      text = json.dumps(data, indent=2)
                  Path('overnight_audit/openai_report.md').write_text(
                      'STATUS: OPENAI_SUCCESS\n\n' + text, encoding='utf-8'
                  )
                  raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  last_error = f'HTTP {e.code}: {e.reason}'
                  retry_after = e.headers.get('Retry-After')
                  if e.code not in (408, 409, 429, 500, 502, 503, 504):
                      break
                  try:
                      delay = max(5, min(120, int(retry_after))) if retry_after else min(120, 2 ** attempt * 5)
                  except ValueError:
                      delay = min(120, 2 ** attempt * 5)
                  if attempt < 5:
                      print(f'OpenAI temporary failure ({last_error}); retry {attempt + 1}/5 after {delay}s')
                      time.sleep(delay)
              except Exception as e:
                  last_error = f'{type(e).__name__}: {e}'
                  if attempt < 5:
                      delay = min(120, 2 ** attempt * 5)
                      print(f'OpenAI client failure ({last_error}); retry {attempt + 1}/5 after {delay}s')
                      time.sleep(delay)

          Path('overnight_audit/openai_report.md').write_text(
              'STATUS: OPENAI_UNAVAILABLE\n\n'
              'OpenAI forensic analysis could not be completed after 5 attempts.\n'
              f'Last error: {last_error}\n\n'
              'The deterministic evidence and test results remain valid and are uploaded separately.\n',
              encoding='utf-8'
          )
          print(f'OpenAI analysis unavailable after retries: {last_error}')
          raise SystemExit(0)
          PY

      - name: Upload audit artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: overnight-0006-0007-openai-audit-${{ github.run_number }}
          path: overnight_audit/
          if-no-files-found: error
