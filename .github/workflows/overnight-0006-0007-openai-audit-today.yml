name: Overnight 0006-0007 OpenAI Audit - Today

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/overnight-0006-0007-openai-audit-today.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check requested time window
        run: |
          NOW_UTC=$(date -u +%s)
          START=$(date -u -d '2026-08-14T03:00:00Z' +%s)
          CUTOFF=$(date -u -d '2026-08-14T11:05:00Z' +%s)
          if [ "$NOW_UTC" -lt "$START" ] || [ "$NOW_UTC" -ge "$CUTOFF" ]; then
            echo 'Outside requested 06:00-14:00 Cairo window; clean exit.'
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Collect deterministic evidence
        shell: bash
        run: |
          set +e
          mkdir -p overnight_audit
          date -u '+%Y-%m-%dT%H:%M:%SZ' > overnight_audit/run_utc.txt
          TZ=Africa/Cairo date '+%Y-%m-%dT%H:%M:%S%z' > overnight_audit/run_cairo.txt
          git rev-parse HEAD > overnight_audit/commit.txt
          {
            echo '=== FILES ==='
            find . -type f -not -path './.git/*' | sort | grep -Ei '0006|0007|pivot|geometry|trendline|evaluator|confirmation|adapter|contract' | head -n 500
            echo '=== KEYWORDS ==='
            git grep -n -I -E 'third_touch|reaction_bounce|no_break|confirmation_available_at|reaction_available_at|TRENDLINE_GEOMETRY_V1|PIVOT_SEQUENCE_V2|NOT_EVALUABLE' -- . ':!overnight_audit' | head -n 1600
          } > overnight_audit/evidence.txt 2>&1
          if [ -d tests ]; then
            python -m pytest -q > overnight_audit/pytest.txt 2>&1
            echo $? > overnight_audit/pytest_exit_code.txt
          else
            echo 'No tests directory detected.' > overnight_audit/pytest.txt
            echo 0 > overnight_audit/pytest_exit_code.txt
          fi

      - name: OpenAI forensic analysis (optional, never blocks audit)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            printf '%s\n' 'STATUS: OPENAI_NOT_CONFIGURED' 'Deterministic audit completed without OpenAI.' > overnight_audit/openai_report.md
            exit 0
          fi
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path
          evidence = Path('overnight_audit/evidence.txt').read_text(errors='ignore')[:120000]
          tests = Path('overnight_audit/pytest.txt').read_text(errors='ignore')[:40000]
          prompt = f'''You are a forensic integration auditor for the AI Trading Assistant project. Target Murphy 0006/0007 only. Use ONLY repository evidence below. Never invent fields, thresholds, tolerances, lookbacks, or evidence. Never use 2025 for tuning/selection. Never declare Production Frozen.

Check lineage: PIVOT_SEQUENCE_V2 -> TRENDLINE_GEOMETRY_V1 -> third_touch -> reaction -> no_break -> availability -> 0006/0007 evaluator.
Classify each link PROVEN / DOWNSTREAM_ONLY / MISSING / CONTRADICTORY.
Return VERDICT, LINKAGE TABLE, EXACT BLOCKERS, SMALLEST SAFE NEXT ACTION, and FREEZE REVIEW READY/NOT_READY.

Repository evidence:\n{evidence}\n\nTests:\n{tests}'''
          body=json.dumps({'model':'gpt-5','input':prompt,'store':False}).encode()
          headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY'],'Content-Type':'application/json'}
          last='unknown'
          for attempt in range(1,6):
              try:
                  req=urllib.request.Request('https://api.openai.com/v1/responses',data=body,headers=headers,method='POST')
                  with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
                  text=data.get('output_text','') or json.dumps(data,indent=2)
                  Path('overnight_audit/openai_report.md').write_text('STATUS: OPENAI_SUCCESS\n\n'+text,encoding='utf-8')
                  break
              except urllib.error.HTTPError as e:
                  last=f'HTTP {e.code}: {e.reason}'
                  retry_after=e.headers.get('Retry-After')
                  if e.code not in (408,409,429,500,502,503,504): break
                  try: delay=max(5,min(120,int(retry_after))) if retry_after else min(120,10*attempt)
                  except ValueError: delay=min(120,10*attempt)
                  time.sleep(delay)
              except Exception as e:
                  last=f'{type(e).__name__}: {e}'
                  time.sleep(min(120,10*attempt))
          else:
              Path('overnight_audit/openai_report.md').write_text('STATUS: OPENAI_UNAVAILABLE\n\nLast error: '+last+'\nDeterministic audit remains authoritative for this run.',encoding='utf-8')
          PY

      - name: Upload audit artifact (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: overnight-0006-0007-audit-${{ github.run_number }}
          path: overnight_audit/
          if-no-files-found: error
