name: TIZ Metadata-Only Compatibility

on:
  push:
    branches:
      - current-stack-dev-backtest-2016-2024-v3
    paths:
      - "03_TIZ/**"
      - "OOS_2025/**"
      - "RUNTIME/DECISION_RUNTIME_V1/**"
      - "compatibility/decision_brain_v1_handoff_adapter.py"
      - "evaluation/frozen_decision_execution_bridge_v1.py"
      - "tests/compatibility/**"
      - "tests/evaluation/**"
      - ".github/workflows/tiz-metadata-only-compatibility.yml"
  pull_request:
    paths:
      - "03_TIZ/**"
      - "OOS_2025/**"
      - "RUNTIME/DECISION_RUNTIME_V1/**"
      - "compatibility/decision_brain_v1_handoff_adapter.py"
      - "evaluation/frozen_decision_execution_bridge_v1.py"
      - "tests/compatibility/**"
      - "tests/evaluation/**"
      - ".github/workflows/tiz-metadata-only-compatibility.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest pandas
      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            compatibility/decision_brain_v1_handoff_adapter.py \
            OOS_2025/full_decision_brain_assembler_v1.py \
            OOS_2025/execution_oos_adapter_v1.py \
            OOS_2025/execution_oos_compatibility_v1.py \
            OOS_2025/tiz_fail_closed_gate_v1.py \
            OOS_2025/tiz_optional_eval_v1.py \
            OOS_2025/tiz_optional_execution_adapter_v2.py \
            RUNTIME/DECISION_RUNTIME_V1/full_brain_runtime_bridge_v1.py \
            RUNTIME/DECISION_RUNTIME_V1/single_event_gate.py \
            evaluation/frozen_decision_execution_bridge_v1.py
      - name: Run TIZ metadata-only compatibility tests
        run: |
          python -m pytest -q \
            tests/compatibility/test_decision_brain_v1_handoff_adapter.py \
            tests/compatibility/test_single_event_gate_tiz_optional.py \
            tests/compatibility/test_tiz_runtime_boundary_resolution_v2.py \
            tests/evaluation/test_frozen_decision_execution_bridge_v1.py \
            tests/evaluation/test_full_decision_brain_assembler_v1.py \
            tests/evaluation/test_tiz_optional_execution_adapter_v2.py \
            OOS_2025/test_execution_oos_adapter_v1.py \
            OOS_2025/test_tiz_fail_closed_gate_v1.py \
            OOS_2025/test_tiz_optional_eval_v1.py \\
            tests/test_knowledge_decision_handoff.py \\
            tests/test_knowledge_decision_brain_runtime.py \\
            TESTS/test_oos_2025_evidence_assembler_v1.py
