name: Development Decision Brain Backtest 2016-2024

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  decision-brain-backtest-2016-2024:
    runs-on: ubuntu-latest
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/OOS_2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Verify Dropbox access
        run: test -n "$DROPBOX_ACCESS_TOKEN"
      - name: Recover governed Nison development evidence
        run: |
          set -eu
          mkdir -p artifacts/nison
          python DEVELOPMENT_2016_2024/run_nison_development_2016_2024_v1.py --output-dir artifacts/nison
          test -s artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv
      - name: Recover current Murphy development evidence from Dropbox project workspace
        run: |
          set -eu
          mkdir -p artifacts/murphy
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token=os.environ['DROPBOX_ACCESS_TOKEN']
          candidates=[
              '/ai_trading_assistant_full_project_v1/MURPHY_2016_2024_FULL_EVIDENCE.csv',
              '/ai_trading_assistant_full_project_v1/MURPHY_2016_2024_FULL_34_RULE_FANIN_SOURCE_PRESERVING.csv',
              '/ai_trading_assistant_full_project_v1/MURPHY_HISTORICAL_EVIDENCE_NORMALIZED_2016_2024.csv',
              '/MURPHY_2016_2024_FULL_EVIDENCE.csv',
              '/MURPHY_2016_2024_FULL_34_RULE_FANIN_SOURCE_PRESERVING.csv',
              '/MURPHY_HISTORICAL_EVIDENCE_NORMALIZED_2016_2024.csv',
          ]
          for path in candidates:
              req=urllib.request.Request('https://content.dropboxapi.com/2/files/download', data=b'', method='POST', headers={'Authorization':f'Bearer {token}','Dropbox-API-Arg':json.dumps({'path':path})})
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      data=r.read()
                  if data:
                      out=Path('artifacts/murphy/MURPHY_2016_2024_FULL_EVIDENCE.csv')
                      out.write_bytes(data)
                      print(f'Recovered Murphy evidence from {path} -> {out} ({len(data)} bytes)')
                      break
              except Exception as exc:
                  print(f'Murphy candidate unavailable: {path}: {exc}')
          else:
              raise SystemExit('BLOCKED: no source-backed Murphy 2016-2024 evidence file was found at the governed Dropbox candidates.')
          PY
          test -s artifacts/murphy/MURPHY_2016_2024_FULL_EVIDENCE.csv
      - name: Acquire Market State context
        run: |
          set -eu
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          token=os.environ['DROPBOX_ACCESS_TOKEN']
          path='/ai_trading_assistant_full_project_v1/AI_Trading_Assistant_MARKET_STATE_READER_V1/GBPUSD_MARKET_STATE.csv'
          req=Request('https://content.dropboxapi.com/2/files/download', data=b'', method='POST', headers={'Authorization':f'Bearer {token}','Dropbox-API-Arg':json.dumps({'path':path})})
          out=Path('artifacts/GBPUSD_MARKET_STATE.csv'); out.parent.mkdir(exist_ok=True)
          with urlopen(req, timeout=180) as r: out.write_bytes(r.read())
          print(out)
          PY
      - name: Run governed 78-rule development backtest
        run: |
          set -eu
          python BACKTEST/DEV_BACKTEST_RUNNER_V1.py \
            --h1 artifacts/nison/source/GBPUSD_H1_2016_2025_MASTER.csv \
            --murphy artifacts/murphy/MURPHY_2016_2024_FULL_EVIDENCE.csv \
            --nison artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv \
            --context artifacts/GBPUSD_MARKET_STATE.csv \
            --output-dir artifacts/decision_brain_backtest_2016_2024
      - name: Store backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decision-brain-backtest-2016-2024
          path: artifacts/decision_brain_backtest_2016_2024
