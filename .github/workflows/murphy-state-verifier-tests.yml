name: Murphy State Verifier Tests

on:
  push:
    paths:
      - 'tools/murphy_state_verifier.py'
      - 'tools/murphy_evidence_chain.py'
      - 'tools/murphy_evidence_collector.py'
      - 'murphy_verifier/**'
      - 'tests/test_murphy_state_verifier.py'
      - 'tests/test_murphy_evidence_chain.py'
      - 'tests/test_murphy_evidence_collector.py'
      - '.github/workflows/murphy-state-verifier-tests.yml'
  pull_request:
    paths:
      - 'tools/murphy_state_verifier.py'
      - 'tools/murphy_evidence_chain.py'
      - 'tools/murphy_evidence_collector.py'
      - 'murphy_verifier/**'
      - 'tests/test_murphy_state_verifier.py'
      - 'tests/test_murphy_evidence_chain.py'
      - 'tests/test_murphy_evidence_collector.py'
      - '.github/workflows/murphy-state-verifier-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run verifier tests
        run: python -m pytest -q tests/test_murphy_state_verifier.py tests/test_murphy_evidence_chain.py tests/test_murphy_evidence_collector.py
