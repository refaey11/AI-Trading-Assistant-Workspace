name: Trigger CircleCI Governed Execution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose exactly one governed stage'
        required: true
        default: 'integration_gate'
        type: choice
        options:
          - integration_gate
          - backtest_2016_2024
  push:
    branches:
      - backtest-only-2026-08-28
    paths:
      - '.github/CIRCLECI_TRIGGER_NOW'

permissions:
  contents: read

jobs:
  trigger-circleci:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve CircleCI project and pipeline definition
        id: resolve
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          CIRCLECI_PROJECT_SLUG: gh/refaey11/AI-Trading-Assistant-Workspace
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CIRCLECI_API_TOKEN:-}" || { echo 'CIRCLECI_API_TOKEN secret is missing'; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://circleci.com/api/v2/project/${CIRCLECI_PROJECT_SLUG}" \
            --header "Circle-Token: ${CIRCLECI_API_TOKEN}" \
            --header 'Accept: application/json' >/tmp/circle_project.json
          PROJECT_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/circle_project.json').read_text())
          print(data['id'])
          PY
          )
          test -n "$PROJECT_ID"
          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://circleci.com/api/v2/projects/${PROJECT_ID}/pipeline-definitions" \
            --header "Circle-Token: ${CIRCLECI_API_TOKEN}" \
            --header 'Accept: application/json' >/tmp/circle_definitions.json
          DEFINITION_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/circle_definitions.json').read_text())
          items=data.get('items', [])
          preferred=[x for x in items if x.get('config_source',{}).get('provider') == 'github_oauth' and x.get('config_source',{}).get('file_path') == '.circleci/config.yml']
          candidates=preferred or [x for x in items if x.get('config_source',{}).get('provider') == 'github_oauth'] or items
          if not candidates:
              raise SystemExit('No CircleCI pipeline definition found.')
          print(candidates[0]['id'])
          PY
          )
          test -n "$DEFINITION_ID"
          echo "CIRCLECI_PROJECT_SLUG=${CIRCLECI_PROJECT_SLUG}" >> "$GITHUB_ENV"
          echo "CIRCLECI_DEFINITION_ID=${DEFINITION_ID}" >> "$GITHUB_ENV"
          echo 'CircleCI project and pipeline definition resolved.'

      - name: Trigger selected governed CircleCI pipeline
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          CIRCLECI_PROJECT_SLUG: ${{ env.CIRCLECI_PROJECT_SLUG }}
          CIRCLECI_DEFINITION_ID: ${{ env.CIRCLECI_DEFINITION_ID }}
          MODE: backtest_2016_2024
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = 'integration_gate' ]; then
            export PARAMETERS='{"run_integration_gate":true,"run_governed_backtest":false}'
          elif [ "$MODE" = 'backtest_2016_2024' ]; then
            export PARAMETERS='{"run_integration_gate":true,"run_governed_backtest":true}'
          else
            echo 'Unsupported mode'; exit 1
          fi
          python - <<'PY' > /tmp/circle_body.json
          import json, os
          body={
              'definition_id': os.environ['CIRCLECI_DEFINITION_ID'],
              'config': {'branch': 'backtest-only-2026-08-28'},
              'checkout': {'branch': 'backtest-only-2026-08-28'},
              'parameters': json.loads(os.environ['PARAMETERS']),
          }
          print(json.dumps(body))
          PY
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://circleci.com/api/v2/project/${CIRCLECI_PROJECT_SLUG}/pipeline/run" \
            --header "Circle-Token: ${CIRCLECI_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data @/tmp/circle_body.json)
          echo 'CircleCI governed pipeline triggered.'
          echo "$RESPONSE"
