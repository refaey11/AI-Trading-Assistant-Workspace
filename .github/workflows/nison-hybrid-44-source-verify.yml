name: Nison Hybrid 44 Source Verify

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nison-hybrid-44-batch-v1
    paths:
      - 'NISON_GITHUB_SOURCE_SYNC_V1.zip'
      - 'nison_batch/source_map_44.py'
      - '.github/workflows/nison-hybrid-44-source-verify.yml'
  pull_request:
    paths:
      - 'NISON_GITHUB_SOURCE_SYNC_V1.zip'
      - 'nison_batch/source_map_44.py'
      - '.github/workflows/nison-hybrid-44-source-verify.yml'

permissions:
  contents: write
  actions: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Nison source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f NISON_GITHUB_SOURCE_SYNC_V1.zip
          echo 'Archive SHA-256:'
          sha256sum NISON_GITHUB_SOURCE_SYNC_V1.zip
          unzip -t NISON_GITHUB_SOURCE_SYNC_V1.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nison_ci_source
          mkdir -p nison_ci_source
          unzip -q NISON_GITHUB_SOURCE_SYNC_V1.zip -d nison_ci_source
          test -d nison_ci_source/01_Integrated_Knowledge/02_Nison_Candlesticks
          test -f nison_ci_source/03_Rule_Registry/INTEGRATED_RULE_REGISTRY_V1.json
          test -d nison_ci_source/03_Rule_Registry
          test "$(find nison_ci_source -type f | wc -l)" -gt 0
          echo 'Detected Nison implementation roots:'
          find nison_ci_source -type d \( -iname '*context*engine*' -o -iname '*candlestick*engine*' \) -print | sort || true
          echo 'Detected adapter contracts:'
          find nison_ci_source -type f \( -iname '*adapter*contract*' -o -iname '*rule*adapter*' \) -print | sort || true

      - name: Build source inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Nison Source CI Inventory'
            echo
            echo "archive_sha256=$(sha256sum NISON_GITHUB_SOURCE_SYNC_V1.zip | awk '{print $1}')"
            echo "file_count=$(find nison_ci_source -type f | wc -l)"
            echo "source_bytes=$(du -sb nison_ci_source | cut -f1)"
            echo
            echo '## Required roots'
            find nison_ci_source -maxdepth 2 -type d | sort
          } > nison-source-ci-report.md
          cat nison-source-ci-report.md

      - name: Run source-bounded 44-rule mapping
        shell: bash
        run: |
          set -euo pipefail
          python nison_batch/source_map_44.py
          cat nison_batch/artifacts/nison_44_source_map.json

      - name: Governance guard
        shell: bash
        run: |
          set -euo pipefail
          cat > nison-governance.txt <<'EOF'
          Nison is confirmation/evidence only.
          No invented thresholds, tolerances, lookbacks, scoring, or direction.
          Unsupported clauses remain NOT_EVALUABLE/BLOCKED.
          2025 is OOS and cannot be used for tuning/calibration/selection/optimization.
          CI must not auto-freeze rules.
          EOF
          cat nison-governance.txt

      - name: Commit source mapping artifact on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nison-hybrid-44-batch-v1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nison_batch/artifacts/nison_44_source_map.json
          if git diff --cached --quiet; then
            echo 'No source mapping changes.'
          else
            git commit -m 'Record Nison 44 source mapping audit'
            git push origin HEAD:feature/nison-hybrid-44-batch-v1
          fi

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nison-source-verification
          path: |
            nison-source-ci-report.md
            nison-governance.txt
            nison_batch/artifacts/nison_44_source_map.json
          retention-days: 14
