name: Murphy 39 Factory Batch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/murphy-hybrid-rule-factory-v1
    paths:
      - 'project_state/MURPHY_39_BATCH_AUDIT_QUEUE_V1.csv'
      - 'project_state/MURPHY_HYBRID_39_FACTORY_MANIFEST_V1.csv'
      - 'tools/run_murphy_39_factory_batch.py'
      - '.github/workflows/murphy-39-factory-batch.yml'
  pull_request:
    paths:
      - 'project_state/MURPHY_39_BATCH_AUDIT_QUEUE_V1.csv'
      - 'project_state/MURPHY_HYBRID_39_FACTORY_MANIFEST_V1.csv'
      - 'tools/run_murphy_39_factory_batch.py'
      - '.github/workflows/murphy-39-factory-batch.yml'

jobs:
  factory-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 39-rule queue
        run: python tools/validate_murphy_39_batch_queue.py
      - name: Validate 39-rule factory manifest
        run: python tools/validate_murphy_hybrid_factory_manifest.py
      - name: Run deterministic batch factory
        run: python tools/run_murphy_39_factory_batch.py
      - name: Upload batch result
        uses: actions/upload-artifact@v4
        with:
          name: murphy-39-factory-batch-result
          path: |
            project_state/MURPHY_39_FACTORY_BATCH_RESULT_V1.json
            project_state/MURPHY_39_FACTORY_BATCH_RESULT_V1.md
