name: Gate 3C 2016 Availability Audit

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Audit year (2016-2024)"
        required: true
        type: string
        default: "2016"

jobs:
  availability_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: gate3c-single-event-e2e-v1
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Validate year
        env:
          AUDIT_YEAR: ${{ inputs.year || '2016' }}
        run: |
          python - <<'PY'
          import os
          y=int(os.environ['AUDIT_YEAR'])
          if not 2016 <= y <= 2024:
              raise SystemExit('FAIL_CLOSED_YEAR_MUST_BE_2016_2024')
          print('Audit year:', y)
          PY
      - name: Acquire source files
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DROPBOX_ACCESS_TOKEN"
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          mkdir -p /tmp/gate3c/source /tmp/gate3c/unpacked/similarity
          curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Dropbox-API-Arg: {"path":"/New 8/GBPUSD_MARKET_STATE 6.csv"}' \
            -o /tmp/gate3c/source/market_state.csv
          curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Dropbox-API-Arg: {"path":"/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_SIMILARITY_MEMORY_V2.zip"}' \
            -o /tmp/gate3c/source/similarity.zip
          unzip -q /tmp/gate3c/source/similarity.zip -d /tmp/gate3c/unpacked/similarity
      - name: Audit year
        env:
          AUDIT_YEAR: ${{ inputs.year || '2016' }}
        run: |
          python tools/gate3c_year_availability_audit_v1.py \
            --year "$AUDIT_YEAR" \
            --market-state /tmp/gate3c/source/market_state.csv \
            --similarity-root /tmp/gate3c/unpacked/similarity \
            --output /tmp/gate3c/gate3c_2016_availability_audit.json
      - name: Print result
        if: always()
        run: cat /tmp/gate3c/gate3c_2016_availability_audit.json 2>/dev/null || true
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3c-availability-audit-${{ inputs.year || '2016' }}
          path: /tmp/gate3c/gate3c_2016_availability_audit.json
          if-no-files-found: ignore
