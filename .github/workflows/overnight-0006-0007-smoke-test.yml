name: Overnight 0006-0007 Smoke Test

on: push

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest
      - name: Run strict MTF source timestamp contract tests
        run: python -m pytest -q BACKTEST/tests/test_mtf_source_contract_gate_timestamp_v1.py
