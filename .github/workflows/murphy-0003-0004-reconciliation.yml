name: Murphy 0003-0004 Reconciliation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Backup release tag
        required: true
        default: workspace-v1
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and reconstruct workspace
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p parts workspace
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_*.zip.part' --dir parts
          cat parts/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_01_OF_03.zip.part \
              parts/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_02_OF_03.zip.part \
              parts/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_03_OF_03.zip.part > workspace-full.zip
          unzip -q workspace-full.zip -d workspace

      - name: Locate canonical artifacts
        run: |
          set -euo pipefail
          {
            echo '# Murphy 0003-0004 Reconciliation Discovery'
            echo
            echo '## Candidate files'
            find workspace -type f \( \
              -iname '*pivot*' -o \
              -iname '*0003*' -o \
              -iname '*0004*' -o \
              -iname '*evaluator*' -o \
              -iname '*historical*' -o \
              -iname '*mapping*' -o \
              -iname '*contract*' \) -print | sort
            echo
            echo '## Files containing rule IDs'
            grep -RIl --exclude-dir=.git -E 'MURPHY_0003|MURPHY_0004|0003|0004' workspace | sort || true
            echo
            echo '## Pivot-related CSV/JSON/MD inventory'
            find workspace -type f \( -iname '*.csv' -o -iname '*.json' -o -iname '*.md' \) | grep -Ei 'pivot|reaction|sequence|0003|0004|trend|structure' | sort || true
          } > reconciliation-discovery.md
          cat reconciliation-discovery.md

      - name: Detect 2025 contamination
        run: |
          set -euo pipefail
          if grep -RIl --exclude-dir=.git -E '(^|[^0-9])2025([^0-9]|$)' workspace | grep -Ei '0003|0004|pivot|historical|evaluator' > possible_2025_refs.txt; then
            echo 'Potential 2025 references found in relevant files:'
            cat possible_2025_refs.txt
          else
            echo 'No obvious 2025 references in filenames/content of relevant files.' > possible_2025_refs.txt
          fi

      - name: Upload reconciliation discovery
        uses: actions/upload-artifact@v4
        with:
          name: murphy-0003-0004-reconciliation-discovery-${{ inputs.release_tag }}
          path: |
            reconciliation-discovery.md
            possible_2025_refs.txt
          retention-days: 14
