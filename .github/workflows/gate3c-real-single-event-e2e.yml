name: Gate 3C Real Single-Event E2E

on:
  workflow_dispatch:

jobs:
  gate3c:
    runs-on: ubuntu-latest
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/OOS_2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: current-stack-dev-backtest-2016-2024-v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas numpy

      - name: Verify Gate 3C runner exists
        run: test -f RUNTIME/DECISION_RUNTIME_V1/gate3c_single_event_e2e_v1.py

      - name: Run one pre-2025 Gate 3C event
        run: |
          python RUNTIME/DECISION_RUNTIME_V1/gate3c_single_event_e2e_v1.py \
            --event RUNTIME/DECISION_RUNTIME_V1/gate3c_single_event_fixture.json \
            --output artifacts/gate3c_single_event_result.json

      - name: Upload Gate 3C result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3c-real-single-event-result
          path: artifacts/gate3c_single_event_result.json
          if-no-files-found: warn
