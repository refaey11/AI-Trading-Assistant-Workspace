name: MTF Source Gate Smoke 2026-09-02

on:
  pull_request:
    branches:
      - current-stack-dev-backtest-2016-2024-v3
    paths:
      - 'BACKTEST/mtf_source_contract_gate_v1.py'
      - 'BACKTEST/CIRCLECI_ACQUIRE_GOVERNED_SOURCES.py'
      - 'BACKTEST/test_circleci_mtf_source_acquisition_v1.py'
      - 'RUNTIME/DECISION_RUNTIME_V1/mtf_brain_input_join_v1.py'
      - '.github/workflows/mtf-source-gate-smoke-2026-09-02.yml'
  push:
    branches:
      - current-stack-dev-backtest-2016-2024-v3
    paths:
      - 'BACKTEST/mtf_source_contract_gate_v1.py'
      - 'BACKTEST/CIRCLECI_ACQUIRE_GOVERNED_SOURCES.py'
      - 'BACKTEST/test_circleci_mtf_source_acquisition_v1.py'
      - 'RUNTIME/DECISION_RUNTIME_V1/mtf_brain_input_join_v1.py'
      - '.github/workflows/mtf-source-gate-smoke-2026-09-02.yml'

permissions:
  contents: read

jobs:
  mtf-source-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout PR head or pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas and pytest
        run: python -m pip install --upgrade pip pandas pytest
      - name: Test canonical six-timeframe MTF acquisition contract
        run: python -m pytest -q BACKTEST/test_circleci_mtf_source_acquisition_v1.py
      - name: Download exact MTF archive
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^"//; s/"$//')"
          test -n "$TOKEN"
          mkdir -p artifacts/source/mtf
          curl -L --fail --silent --show-error \
            https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Dropbox-API-Arg: {"path":"/MTF_ALIGNMENT_GBPUSD_V1.zip"}' \
            -o artifacts/mtf.zip
          unzip -q artifacts/mtf.zip -d artifacts/source/mtf
      - name: Verify all annual source files and report unavailable values without filling them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from BACKTEST.mtf_source_contract_gate_v1 import REQUIRED, inspect, parse_aware_timestamps

          root = Path('artifacts/source/mtf')
          frames = []
          blockers = []

          for year in range(2016, 2025):
              matches = sorted(root.rglob(f'GBPUSD_M5_MTF_ALIGNMENT_{year}.csv'))
              if len(matches) != 1:
                  blockers.append(f'MTF_FILE_COUNT_FAIL:{year}:{matches}')
                  continue

              path = matches[0]
              try:
                  inspect(path)
              except SystemExit as exc:
                  blockers.append(f'{year}:{exc}')
                  continue

              frame = pd.read_csv(path, low_memory=False)
              frame['timestamp'] = parse_aware_timestamps(
                  frame['timestamp'],
                  label=f'MTF_SOURCE:{year}',
              )
              for field in REQUIRED:
                  frame[field] = pd.to_numeric(frame[field], errors='raise').astype(float)
              frames.append(frame)

          if blockers:
              print('MTF_SOURCE_BLOCKERS_BEGIN')
              for blocker in blockers:
                  print(blocker)
              print('MTF_SOURCE_BLOCKERS_END')
              raise SystemExit('BLOCKED_MTF_SOURCE_ARCHIVE')

          if len(frames) != 9:
              raise SystemExit(f'MTF_ANNUAL_FILE_COUNT_FAIL:expected=9:actual={len(frames)}')

          combined = pd.concat(frames, ignore_index=True).sort_values('timestamp').reset_index(drop=True)
          if combined['timestamp'].duplicated().any():
              raise SystemExit('MTF_GLOBAL_TIMESTAMP_DUPLICATE_FAIL')

          combined.to_csv('artifacts/MTF_CURRENT_STACK.csv', index=False)
          print('MTF_6TF_SOURCE_PASS')
          print('ROWS', len(combined))
          print('YEARS', sorted(combined.timestamp.dt.year.unique().tolist()))
          PY
      - name: Run fail-closed contract gate
        run: python BACKTEST/mtf_source_contract_gate_v1.py --mtf artifacts/MTF_CURRENT_STACK.csv
