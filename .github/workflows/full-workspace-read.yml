name: Full Workspace Read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Backup release tag to read'
        required: true
        default: 'workspace-v1'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  read-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backup parts from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-parts workspace
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_*.zip.part' \
            --dir backup-parts
          ls -lh backup-parts
          test "$(find backup-parts -type f | wc -l)" -eq 3

      - name: Verify and reconstruct full archive
        shell: bash
        run: |
          set -euo pipefail
          cd backup-parts
          sha256sum *.zip.part | sort > ../backup-parts.sha256
          cat ../backup-parts.sha256
          cat \
            GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_01_OF_03.zip.part \
            GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_02_OF_03.zip.part \
            GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_03_OF_03.zip.part \
            > ../workspace-full.zip
          cd ..
          ls -lh workspace-full.zip
          unzip -t workspace-full.zip

      - name: Extract workspace
        shell: bash
        run: |
          set -euo pipefail
          unzip -q workspace-full.zip -d workspace
          echo 'Top-level extracted content:'
          find workspace -maxdepth 2 -mindepth 1 -print | head -200

      - name: Build complete workspace manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Full Workspace Manifest'
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## File count'
            find workspace -type f | wc -l
            echo
            echo '## Total bytes'
            du -sb workspace | cut -f1
            echo
            echo '## Files'
            find workspace -type f -printf '%p\t%s bytes\n' | sort
          } > workspace-manifest.md

      - name: Read text/config files and generate inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('workspace')
          text_ext = {
              '.md','.txt','.json','.jsonl','.yaml','.yml','.csv','.tsv','.sql',
              '.py','.js','.ts','.tsx','.jsx','.mjs','.cjs','.toml','.ini','.cfg',
              '.xml','.html','.css','.sh','.bat','.ps1','.r','.ipynb'
          }
          records=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rec={'path':str(p),'bytes':p.stat().st_size}
              h=hashlib.sha256()
              try:
                  data=p.read_bytes()
                  h.update(data)
                  rec['sha256']=h.hexdigest()
                  if p.suffix.lower() in text_ext:
                      text=data.decode('utf-8',errors='replace')
                      rec['text']=True
                      rec['lines']=text.count('\n') + (1 if text else 0)
                      rec['chars']=len(text)
                  else:
                      rec['text']=False
              except Exception as e:
                  rec['error']=repr(e)
              records.append(rec)

          Path('workspace-inventory.json').write_text(json.dumps(records,indent=2),encoding='utf-8')
          text=[r for r in records if r.get('text')]
          with Path('workspace-text-inventory.md').open('w',encoding='utf-8') as f:
              f.write('# Workspace Text Inventory\n\n')
              f.write(f'Total files: {len(records)}\n\n')
              f.write(f'Text/config files: {len(text)}\n\n')
              for r in text:
                  f.write(f"- `{r['path']}` — {r['lines']} lines, {r['chars']} chars, sha256 `{r['sha256']}`\n")
          print(f'Indexed {len(records)} files; {len(text)} text/config files.')
          PY

      - name: Produce integrity report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Workspace Read / Integrity Report'
            echo
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## Backup parts'
            cat backup-parts.sha256
            echo
            echo '## Reconstructed archive'
            sha256sum workspace-full.zip
            stat -c 'archive_bytes=%s' workspace-full.zip
            echo
            echo '## Extracted workspace'
            find workspace -type f | wc -l | awk '{print "file_count=" $1}'
            du -sb workspace | cut -f1 | awk '{print "total_bytes=" $1}'
            echo
            echo '## Git repository snapshot'
            git rev-parse HEAD
            git status --short
          } > workspace-read-report.txt

      - name: Upload full read artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-workspace-read-${{ inputs.release_tag }}
          path: |
            workspace-manifest.md
            workspace-inventory.json
            workspace-text-inventory.md
            workspace-read-report.txt
            backup-parts.sha256
          retention-days: 14

      - name: Upload extracted workspace for inspection
        uses: actions/upload-artifact@v4
        with:
          name: extracted-workspace-${{ inputs.release_tag }}
          path: workspace/
          retention-days: 7
