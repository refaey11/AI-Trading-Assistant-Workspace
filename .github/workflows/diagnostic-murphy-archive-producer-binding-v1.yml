name: Diagnostic Murphy Archive Producer Binding V1

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/murphy-34-recovery-2026-09-02

permissions:
  contents: read

jobs:
  murphy-archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Murphy archive producer binding audit
        run: |
          set -euo pipefail
          test -n "$DROPBOX_ACCESS_TOKEN"
          python BACKTEST/MURPHY_ARCHIVE_PRODUCER_BINDING_AUDIT_V1.py

      - name: Run strict-asof producer sanitizer
        run: |
          set -euo pipefail
          python BACKTEST/MURPHY_STRICT_ASOF_PRODUCER_SANITIZER_V1.py

      - name: Preserve audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murphy-archive-producer-binding-audit-${{ github.run_number }}
          path: artifacts/murphy_34_workspace_audit/
          if-no-files-found: warn
