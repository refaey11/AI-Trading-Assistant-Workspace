name: Overnight 0006-0007 Runner

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner
        run: |
          echo "Runner started"
          echo "OpenAI key configured: $([ -n \"${OPENAI_API_KEY:-}\" ] && echo yes || echo no)"
