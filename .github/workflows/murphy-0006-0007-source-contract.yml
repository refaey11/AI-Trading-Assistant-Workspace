name: Murphy 0006-0007 Source Contract

on:
  push:
    branches:
      - feature/murphy-0006-0007-source-contract
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-contract tests
        working-directory: audits
        run: python -m pytest -q test_murphy_0006_0007_trendline_source_contract_v1.py
