name: Gate 3C - Single Real Event E2E V2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_SINGLE_EVENT to execute exactly one event"
        required: true
        type: string
        default: ""
      timestamp:
        description: "UTC event timestamp"
        required: true
        type: string
        default: "2016-04-20T09:00:00Z"
      equity:
        description: "Explicit evaluation account equity"
        required: true
        type: string
        default: "10000"
      peak_equity:
        description: "Explicit evaluation account peak equity"
        required: true
        type: string
        default: "10000"
      prior_loss_streak:
        description: "Explicit prior loss streak for this single-event proof"
        required: true
        type: string
        default: "0"

jobs:
  single_real_event_e2e:
    if: ${{ inputs.confirm == 'RUN_SINGLE_EVENT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest

      - name: Verify pre-2025 target only
        env:
          EVENT_TS: ${{ inputs.timestamp }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          ts = datetime.fromisoformat(os.environ['EVENT_TS'].replace('Z','+00:00')).astimezone(timezone.utc)
          if not (datetime(2016,1,1,tzinfo=timezone.utc) <= ts < datetime(2025,1,1,tzinfo=timezone.utc)):
              raise SystemExit('FAIL_CLOSED: event must be inside 2016-2024 development window')
          print(ts.isoformat())
          PY

      - name: Acquire one-event source slices from Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          EVENT_TS: ${{ inputs.timestamp }}
        run: |
          set -euo pipefail
          test -n "$DROPBOX_ACCESS_TOKEN"
          mkdir -p /tmp/gate3c/source /tmp/gate3c/unpacked
          download() {
            local path="$1"; local out="$2"
            curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download \
              -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" \
              -H "Dropbox-API-Arg: {\"path\":\"${path}\"}" \
              -o "$out"
          }
          download "/New 8/GBPUSD_H1_2016_2025_MASTER.zip" /tmp/gate3c/source/h1.zip
          download "/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip" /tmp/gate3c/source/murphy.zip
          download "/New 8/MTF_ALIGNMENT_GBPUSD_V1.zip" /tmp/gate3c/source/mtf.zip
          download "/New 8/GBPUSD_MARKET_STATE 6.csv" /tmp/gate3c/source/market_state.csv
          download "/New 8/NISON_2016_2024_FULL_EVIDENCE.csv" /tmp/gate3c/source/nison.csv
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_CONTEXT_MEMORY_V1.zip" /tmp/gate3c/source/hc.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_HISTORICAL_OUTCOME_MEMORY_V1.zip" /tmp/gate3c/source/ho.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_SIMILARITY_MEMORY_V2.zip" /tmp/gate3c/source/similarity.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_CONTEXT_AWARE_RETRIEVAL_V2.zip" /tmp/gate3c/source/retrieval.zip
          for z in h1 murphy mtf hc ho similarity retrieval; do unzip -q "/tmp/gate3c/source/${z}.zip" -d "/tmp/gate3c/unpacked/${z}"; done
          python - <<'PY'
          from pathlib import Path
          import os, csv
          ts = os.environ['EVENT_TS']
          root = Path('/tmp/gate3c')
          src = root/'source'/'nison.csv'
          out = root/'event_nison.csv'
          with src.open('r', encoding='utf-8', newline='') as f, out.open('w', encoding='utf-8', newline='') as g:
              r = csv.DictReader(f); w = csv.DictWriter(g, fieldnames=r.fieldnames); w.writeheader()
              for row in r:
                  if str(row.get('timestamp','')).replace('+00:00','Z') == ts:
                      w.writerow(row)
          def filter_csv(srcpath, dst, key='timestamp'):
              with open(srcpath, 'r', encoding='utf-8', newline='') as f, open(dst, 'w', encoding='utf-8', newline='') as g:
                  r=csv.DictReader(f); w=csv.DictWriter(g, fieldnames=r.fieldnames); w.writeheader()
                  for row in r:
                      v=str(row.get(key,''))
                      if v.replace('+00:00','Z') == ts or v == ts.replace('Z','+00:00'):
                          w.writerow(row)
          h1s = list((root/'unpacked'/'h1').rglob('GBPUSD_H1_2016_2025_MASTER.csv'))
          if not h1s:
              raise SystemExit('BLOCKED_H1_MASTER_CSV_NOT_FOUND')
          filter_csv(h1s[0], root/'event_h1.csv')
          filter_csv(root/'source'/'market_state.csv', root/'event_context.csv')
          print('prepared event slices for', ts)
          PY

      - name: Build authoritative single-event risk evidence
        env:
          EVENT_TS: ${{ inputs.timestamp }}
          EQUITY: ${{ inputs.equity }}
          PEAK_EQUITY: ${{ inputs.peak_equity }}
          PRIOR_LOSS_STREAK: ${{ inputs.prior_loss_streak }}
        run: |
          set -euo pipefail
          python OOS_2025/build_single_event_risk_evidence_v1.py \
            --timestamp "$EVENT_TS" \
            --h1 /tmp/gate3c/event_h1.csv \
            --market-state /tmp/gate3c/event_context.csv \
            --murphy-root /tmp/gate3c/unpacked/murphy \
            --output /tmp/gate3c/unpacked/retrieval/gate3c_risk_evidence.csv \
            --equity "$EQUITY" \
            --peak-equity "$PEAK_EQUITY" \
            --prior-loss-streak "$PRIOR_LOSS_STREAK"

      - name: Build single canonical event input
        env:
          EVENT_TS: ${{ inputs.timestamp }}
        run: |
          set -euo pipefail
          python tools/gate3c_build_single_event_bundle_v1.py \
            --timestamp "$EVENT_TS" \
            --h1 /tmp/gate3c/event_h1.csv \
            --market-state /tmp/gate3c/event_context.csv \
            --nison /tmp/gate3c/event_nison.csv \
            --murphy-root /tmp/gate3c/unpacked/murphy \
            --mtf-root /tmp/gate3c/unpacked/mtf \
            --historical-context-root /tmp/gate3c/unpacked/hc \
            --historical-outcome-root /tmp/gate3c/unpacked/ho \
            --similarity-root /tmp/gate3c/unpacked/similarity \
            --retrieval-root /tmp/gate3c/unpacked/retrieval \
            --output /tmp/gate3c/canonical_event.json

      - name: Run Full Brain -> Risk -> Trade Plan proof
        run: |
          set -euo pipefail
          python RUNTIME/DECISION_RUNTIME_V1/gate3c_single_event_e2e_v1.py \
            --event /tmp/gate3c/canonical_event.json \
            --output /tmp/gate3c/gate3c_result.json

      - name: Print result
        if: always()
        run: cat /tmp/gate3c/gate3c_result.json 2>/dev/null || true

      - name: Upload one-event result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3c-single-event-result
          path: /tmp/gate3c/gate3c_result.json
          if-no-files-found: ignore
