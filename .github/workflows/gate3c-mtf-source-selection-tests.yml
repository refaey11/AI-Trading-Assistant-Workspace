name: Gate3C MTF Source Selection Tests

on:
  push:
    branches:
      - current-stack-dev-backtest-2016-2024-v3
  pull_request:
    branches:
      - current-stack-dev-backtest-2016-2024-v3

permissions:
  contents: read

jobs:
  gate3c-mtf-source-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run MTF source selection and Murphy contract tests
        run: |
          python -m pytest -q \
            tests/test_gate3c_mtf_source_selection_v1.py \
            tests/evaluation/test_gate3c_murphy_direction_contract_v1.py \\\n            tests/test_gate3c_valid_event_candidate_v1.py
