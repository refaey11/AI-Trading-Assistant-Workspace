name: Decision Brain Progressive Gate 01 (MANUAL)

on:
  workflow_dispatch:

jobs:
  gate01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Gate 01 boundary tests
        run: python -m pytest -q tests/test_knowledge_decision_handoff.py tests/test_knowledge_decision_brain_runtime.py tests/test_progressive_decision_brain_gate_01_2026-08-22.py
