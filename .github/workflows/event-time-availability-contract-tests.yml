name: Event Time Availability Contract Tests

on:
  push:
    branches:
      - contract/event-time-availability-v1
  pull_request:
    branches:
      - audit/brain-mtf-confidence-diagnostics
      - current-stack-dev-backtest-2016-2024-v3
    paths:
      - "compatibility/event_time_availability_contract_v1.py"
      - "tests/compatibility/test_event_time_availability_contract_v1.py"
      - ".github/workflows/event-time-availability-contract-tests.yml"

permissions:
  contents: read

jobs:
  event-time-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run fail-closed event time contract tests
        run: python -m pytest -q tests/compatibility/test_event_time_availability_contract_v1.py
