name: Current Stack Development Backtest 2016-2024 V5.4

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact confirmation string
        required: true
        type: string
        default: ""
  push:
    branches:
      - current-stack-dev-backtest-2016-2024-v3

permissions:
  contents: read

jobs:
  current_stack_v5_4:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'RUN_CURRENT_STACK_BACKTEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run governed V5.4 replay
        run: |
          set -euo pipefail
          python --version
          test -f DEVELOPMENT_2016_2024/current_stack_historical_replay_v5_4.py
          test -f DEVELOPMENT_2016_2024/test_v5_4_contract.py
          python DEVELOPMENT_2016_2024/test_v5_4_contract.py
          echo 'V5.4 contract PASS'
          echo 'GitHub Actions execution path is authoritative; CircleCI is not part of this workflow.'
