name: Diagnostic Full Backtest V5.4 2016-2024 V2

on:
  push:
    branches:
      - diagnostic/mtf-gate-observable-2026-09-02
  pull_request:
    branches:
      - current-stack-dev-backtest-2016-2024-v3

permissions:
  contents: read

jobs:
  diagnostic-full-replay-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/OOS_2025
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Governance V2
        run: python BACKTEST/pre_backtest_governance_gate_v2_diagnostic.py
      - name: Development window lock
        run: |
          echo DEVELOPMENT_WINDOW=2016-2024
          echo 2025_OOS_LOCKED=True
      - name: Component completeness
        run: python DEVELOPMENT_2016_2024/current_stack_component_completeness_gate_v1.py
      - name: Runtime wiring
        run: python DEVELOPMENT_2016_2024/current_stack_runtime_wiring_gate_v1.py
      - name: Acquire governed sources
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          test -n "$TOKEN"
          mkdir -p artifacts/source/{h1,murphy,mtf,memory/{historical_context,historical_outcome,similarity,retrieval,scenario}}
          download(){ curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${TOKEN}" -H "Dropbox-API-Arg: {\"path\":\"$1\"}" -o "$2"; }
          download "/New 8/GBPUSD_H1_2016_2025_MASTER.zip" artifacts/source/h1.zip
          download "/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip" artifacts/source/murphy.zip
          download "/New 8/NISON_2016_2024_FULL_EVIDENCE.csv" artifacts/source/nison.csv
          download "/New 8/GBPUSD_MARKET_STATE 6.csv" artifacts/source/market_state.csv
          download "/MTF_ALIGNMENT_GBPUSD_V1.zip" artifacts/source/mtf.zip
          download "/ai_trading_assistant_full_project_v1/AI_Trading_Assistant_HISTORICAL_CONTEXT_MEMORY_V1.zip" artifacts/source/memory/historical_context.zip
          download "/ai_trading_assistant_full_project_v1/AI_Trading_Assistant_HISTORICAL_OUTCOME_MEMORY_V1.zip" artifacts/source/memory/historical_outcome.zip
          download "/ai_trading_assistant_full_project_v1/AI_Trading_Assistant_SIMILARITY_MEMORY_V2.zip" artifacts/source/memory/similarity.zip
          download "/ai_trading_assistant_full_project_v1/AI_Trading_Assistant_CONTEXT_AWARE_RETRIEVAL_V2.zip" artifacts/source/memory/retrieval.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1/AI_Trading_Assistant_MARKET_SCENARIO_ENGINE_V1.zip" artifacts/source/memory/scenario.zip
          unzip -q artifacts/source/h1.zip -d artifacts/source/h1
          unzip -q artifacts/source/murphy.zip -d artifacts/source/murphy
          unzip -q artifacts/source/mtf.zip -d artifacts/source/mtf
          unzip -q artifacts/source/memory/historical_context.zip -d artifacts/source/memory/historical_context
          unzip -q artifacts/source/memory/historical_outcome.zip -d artifacts/source/memory/historical_outcome
          unzip -q artifacts/source/memory/similarity.zip -d artifacts/source/memory/similarity
          unzip -q artifacts/source/memory/retrieval.zip -d artifacts/source/memory/retrieval
          unzip -q artifacts/source/memory/scenario.zip -d artifacts/source/memory/scenario
      - name: Canonical Murphy source
        run: cp "$(find artifacts/source/murphy -type f -name 'MURPHY_2016_2024_FULL_EVIDENCE.csv' | head -1)" artifacts/source/MURPHY_CURRENT_STACK.csv
      - name: Build canonical six-TF MTF source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, pandas as pd
          root=Path('artifacts/source/mtf')
          fields=['mtf_trend_score','M5_trend_regime','M15_trend_regime','M30_trend_regime','H1_trend_regime','H4_trend_regime','D1_trend_regime']
          required={'timestamp',*fields}
          frames=[]; warmups=[]
          for year in range(2016,2025):
              matches=sorted(root.rglob(f'GBPUSD_M5_MTF_ALIGNMENT_{year}.csv'))
              if len(matches)!=1: raise SystemExit(f'MTF_FILE_COUNT_FAIL:{year}:{matches}')
              p=matches[0]
              df=pd.read_csv(p,low_memory=False)
              missing=sorted(required-set(df.columns))
              if missing: raise SystemExit(f'MTF_REQUIRED_COLUMNS_FAIL:{year}:{missing}')
              df['timestamp']=pd.to_datetime(df['timestamp'],utc=True,errors='raise',format='mixed')
              complete=df[fields].notna().all(axis=1)
              if not complete.any(): raise SystemExit(f'MTF_NO_COMPLETE_ROW:{year}')
              first_complete=complete.idxmax()
              post=df.loc[first_complete:].copy()
              if post[fields].isna().any().any(): raise SystemExit(f'MTF_GAP_AFTER_WARMUP:{year}')
              warmups.append({'year':year,'warmup_rows':int(first_complete),'first_complete_timestamp':str(df.loc[first_complete,'timestamp'])})
              frames.append(post)
          combined=pd.concat(frames,ignore_index=True).sort_values('timestamp').reset_index(drop=True)
          if combined['timestamp'].duplicated().any(): raise SystemExit('MTF_GLOBAL_TIMESTAMP_DUPLICATE_FAIL')
          years=sorted(combined.timestamp.dt.year.astype(int).unique().tolist())
          if years != list(range(2016,2025)): raise SystemExit(f'MTF_YEARS_FAIL:{years}')
          combined.to_csv('artifacts/source/MTF_CURRENT_STACK.csv',index=False)
          Path('artifacts/source/MTF_COVERAGE_REPORT.json').write_text(json.dumps({'status':'PASS','rows':len(combined),'coverage_years':years,'timeframes':['M5','M15','M30','H1','H4','D1'],'producer_values_used_verbatim':True,'categorical_translation_applied':False,'imputation_applied':False,'scaling_applied':False,'direction_generated':False,'warmup_by_year':warmups},indent=2),encoding='utf-8')
          print('MTF_6TF_EVENT_READY_PASS',len(combined),years)
          PY
      - name: Canonical MTF contract gate
        run: python BACKTEST/mtf_source_contract_gate_v1.py --mtf artifacts/source/MTF_CURRENT_STACK.csv
      - name: Resolve memory source files
        run: |
          set -euo pipefail
          HC=$(find artifacts/source/memory/historical_context -type f -name 'HISTORICAL_CONTEXT_MEMORY.csv' | head -1)
          HO=$(find artifacts/source/memory/historical_outcome -type f -name 'HISTORICAL_OUTCOMES.csv' | head -1)
          SIM=$(find artifacts/source/memory/similarity -type f -name 'SIMILAR_CONTEXT_READS.json' | head -1)
          RET=$(find artifacts/source/memory/retrieval -type f -name 'CONTEXT_AWARE_READINGS.json' | head -1)
          SCN=$(find artifacts/source/memory/scenario -type f -name 'MARKET_SCENARIOS.json' | head -1)
          test -n "$HC" && test -n "$HO" && test -n "$SIM" && test -n "$RET" && test -n "$SCN"
          printf 'HISTORICAL_CONTEXT=%s\nHISTORICAL_OUTCOME=%s\nSIMILARITY_ARTIFACT=%s\nRETRIEVAL_ARTIFACT=%s\nSCENARIO_ARTIFACT=%s\n' "$HC" "$HO" "$SIM" "$RET" "$SCN" > artifacts/source/memory/RESOLVED_MEMORY_PATHS.txt
      - name: Replay patch self-check
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('DEVELOPMENT_2016_2024/current_stack_historical_replay_v5_4.py')
          s=p.read_text(encoding='utf-8')
          assert 'import re' in s
          assert 're.subn(' in s
          assert "rr_target = 1\\.5 \\* atr" in s
          assert 'TP_R * stop_distance' in s
          assert 'stop_distance=stop_distance' in s
          assert 'V5_4_RR_PATCH_COUNT_FAIL' in s
          assert 'V5_4_STOP_PATCH_COUNT_FAIL' in s
          ast.parse(s)
          print('V5_4_PATCH_SELF_CHECK=PASS')
          PY
      - name: Run V5.4 full-window replay
        run: |
          set -euo pipefail
          H1=$(find artifacts/source/h1 -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
          test -n "$H1"
          HC=$(grep '^HISTORICAL_CONTEXT=' artifacts/source/memory/RESOLVED_MEMORY_PATHS.txt | cut -d= -f2-)
          HO=$(grep '^HISTORICAL_OUTCOME=' artifacts/source/memory/RESOLVED_MEMORY_PATHS.txt | cut -d= -f2-)
          SIM=$(grep '^SIMILARITY_ARTIFACT=' artifacts/source/memory/RESOLVED_MEMORY_PATHS.txt | cut -d= -f2-)
          RET=$(grep '^RETRIEVAL_ARTIFACT=' artifacts/source/memory/RESOLVED_MEMORY_PATHS.txt | cut -d= -f2-)
          SCN=$(grep '^SCENARIO_ARTIFACT=' artifacts/source/memory/RESOLVED_MEMORY_PATHS.txt | cut -d= -f2-)
          python DEVELOPMENT_2016_2024/current_stack_historical_replay_v5_4.py --h1 "$H1" --market-state artifacts/source/market_state.csv --murphy artifacts/source/MURPHY_CURRENT_STACK.csv --nison artifacts/source/nison.csv --mtf artifacts/source/MTF_CURRENT_STACK.csv --historical-context "$HC" --historical-outcome "$HO" --similarity-artifact "$SIM" --retrieval-artifact "$RET" --scenario-artifact "$SCN" --output-dir artifacts/current_stack_backtest_2016_2024
      - name: Backtest provenance audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('artifacts/current_stack_backtest_2016_2024')
          metrics=json.loads((root/'current_stack_backtest_metrics_2016_2024.json').read_text())
          manifest=json.loads((root/'current_stack_validation_manifest_2016_2024.json').read_text())
          events=pd.read_csv(root/'current_stack_decision_events_2016_2024.csv',low_memory=False)
          trades=pd.read_csv(root/'current_stack_executed_trades_2016_2024.csv',low_memory=False)
          assert manifest['window_2016_2024_only'] is True
          assert manifest['future_data_used'] is False
          assert manifest['trade_lifecycle_event_driven'] is True
          assert manifest['pnl_recorded_only_on_exit'] is True
          assert manifest['risk_state_updates_only_on_realized_pnl'] is True
          assert metrics['official_profitability_claim'] is False
          if len(events): assert pd.to_datetime(events['timestamp'],utc=True,format='mixed').dt.year.max() <= 2024
          if len(trades): assert pd.to_datetime(trades['entry_timestamp'],utc=True,format='mixed').dt.year.max() <= 2024
          closed=trades[trades['r_multiple'].notna()].copy() if 'r_multiple' in trades.columns else pd.DataFrame()
          ambiguous=int((trades['outcome'].astype(str).str.upper()=='AMBIGUOUS').sum()) if 'outcome' in trades.columns else 0
          assert len(closed)==int(metrics['executed_trades']), f"REALIZED_TRADE_COUNT_MISMATCH:{len(closed)}!={metrics['executed_trades']}"
          assert len(closed)==int(metrics['wins'])+int(metrics['losses']), f"WIN_LOSS_COUNT_MISMATCH:{len(closed)}!={metrics['wins']}+{metrics['losses']}"
          report={'status':'PASS','development_window':'2016-2024','2025_OOS_LOCKED':True,'events':len(events),'trade_rows':len(trades),'realized_executed_trades':len(closed),'ambiguous_trade_rows':ambiguous,'metrics':metrics,'official_profitability_claim':False}
          Path('artifacts/BACKTEST_PROVENANCE_AUDIT_V5_4.json').write_text(json.dumps(report,indent=2,default=str))
          print(json.dumps(report,indent=2,default=str))
          PY
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-full-backtest-v5-4-2016-2024-v2
          path: artifacts
          if-no-files-found: ignore
