name: Gate 3C Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate3c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pandas
      - name: Run full Decision Brain test suite
        run: python -m pytest -vv tests
