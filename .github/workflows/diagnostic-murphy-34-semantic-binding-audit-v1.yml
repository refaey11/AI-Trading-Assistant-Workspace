name: Diagnostic Murphy 34 Semantic Binding Audit V1

on:
  push:
    branches:
      - diagnostic/murphy-34-recovery-2026-09-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-binding-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact recovery revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Acquire Murphy archive and workspace
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          test -n "$TOKEN"
          mkdir -p artifacts/murphy_workspace/parts artifacts/murphy_workspace/extracted
          download(){ curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download -H "Authorization: Bearer ${TOKEN}" -H "Dropbox-API-Arg: {\"path\":\"$1\"}" -o "$2"; }
          download "/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip" artifacts/murphy.zip
          unzip -q artifacts/murphy.zip -d artifacts/murphy
          for i in 1 2 3; do
            case "$i" in
              1) p="/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_01_OF_03.zip.part";;
              2) p="/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_02_OF_03.zip.part";;
              3) p="/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_PART_03_OF_03.zip.part";;
            esac
            download "$p" "artifacts/murphy_workspace/parts/part${i}.zip.part"
          done
          cat artifacts/murphy_workspace/parts/part1.zip.part artifacts/murphy_workspace/parts/part2.zip.part artifacts/murphy_workspace/parts/part3.zip.part > artifacts/murphy_workspace/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_FULL.zip
          unzip -q artifacts/murphy_workspace/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_FULL.zip -d artifacts/murphy_workspace/extracted
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('artifacts/murphy_workspace/GBPUSD_RULE_EVALUATOR_V2_WORKSPACE_FULL.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('ARCHIVE_OK', p.stat().st_size)
          PY

      - name: Run 34-rule semantic binding audit
        run: |
          set -euo pipefail
          python BACKTEST/MURPHY_34_SEMANTIC_BINDING_AUDIT_V1.py \
            --root artifacts/murphy_workspace/extracted \
            --csv artifacts/MURPHY_34_SEMANTIC_BINDING_AUDIT_V1.csv \
            --json artifacts/MURPHY_34_SEMANTIC_BINDING_AUDIT_V1.json

      - name: Publish audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murphy-34-semantic-binding-audit-v1
          path: artifacts/
          if-no-files-found: warn
