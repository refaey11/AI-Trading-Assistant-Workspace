name: Murphy Historical Producer Reconciliation Recovery V1

on:
  push:
    branches:
      - murphy-reconciliation-recovery-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: murphy-reconciliation-recovery-v1
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: python -m pip install --upgrade pip pandas

      - name: Verify Dropbox token is present
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          test -n "$TOKEN"
          echo "DROPBOX_TOKEN_PRESENT=true" >> "$GITHUB_ENV"

      - name: Acquire governed Murphy bundle
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^\"//; s/\"$//')"
          mkdir -p artifacts/source/murphy
          curl -L --fail --silent --show-error https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Dropbox-API-Arg: {"path":"/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip"}' \
            -o artifacts/source/murphy.zip
          unzip -q artifacts/source/murphy.zip -d artifacts/source/murphy

      - name: Reconcile every Murphy historical producer
        run: python DEVELOPMENT_2016_2024/murphy_historical_producer_reconciliation_v1.py

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murphy-historical-producer-reconciliation-recovery-v1
          path: |
            artifacts/source/MURPHY_HISTORICAL_PRODUCER_RECONCILIATION.json
            artifacts/source/MURPHY_CURRENT_STACK.csv
          if-no-files-found: ignore
