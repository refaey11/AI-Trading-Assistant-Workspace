name: Murphy Evidence Adapter Tests

on:
  push:
    paths:
      - 'src/murphy_0006_0007/**'
      - 'tests/test_murphy_0006_0007_evidence_adapter.py'
      - 'tests/test_murphy_0006_0007_decision_brain_adapter.py'
      - 'risk_engine/**'
      - 'tests/risk_engine/test_murphy_0042_0045_gate_adapter.py'
      - '.github/workflows/murphy-evidence-adapter-tests.yml'
  pull_request:
    paths:
      - 'src/murphy_0006_0007/**'
      - 'tests/test_murphy_0006_0007_evidence_adapter.py'
      - 'tests/test_murphy_0006_0007_decision_brain_adapter.py'
      - 'risk_engine/**'
      - 'tests/risk_engine/test_murphy_0042_0045_gate_adapter.py'
      - '.github/workflows/murphy-evidence-adapter-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Murphy adapter tests
        run: python -m pytest -q tests/test_murphy_0006_0007_evidence_adapter.py tests/test_murphy_0006_0007_decision_brain_adapter.py tests/risk_engine/test_murphy_0042_0045_gate_adapter.py
