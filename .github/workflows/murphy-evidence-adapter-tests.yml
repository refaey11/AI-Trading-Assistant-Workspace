name: Murphy Evidence Adapter Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/murphy_0006_0007/**'
      - 'scripts/build_murphy_0006_0007_confirmation_evidence.py'
      - 'scripts/run_murphy_0006_0007_real_data_candidates.py'
      - 'tests/test_murphy_0006_0007_evidence_adapter.py'
      - 'tests/test_murphy_0006_0007_confirmation_evidence_layer.py'
      - 'tests/test_murphy_0006_0007_confirmation_evidence_builder.py'
      - 'tests/test_murphy_0006_0007_real_data_runner_contract.py'
      - 'tests/test_murphy_0006_0007_upstream_fact_adapter.py'
      - '.github/workflows/murphy-evidence-adapter-tests.yml'
  pull_request:
    paths:
      - 'src/murphy_0006_0007/**'
      - 'scripts/build_murphy_0006_0007_confirmation_evidence.py'
      - 'scripts/run_murphy_0006_0007_real_data_candidates.py'
      - 'tests/test_murphy_0006_0007_evidence_adapter.py'
      - 'tests/test_murphy_0006_0007_confirmation_evidence_layer.py'
      - 'tests/test_murphy_0006_0007_confirmation_evidence_builder.py'
      - 'tests/test_murphy_0006_0007_real_data_runner_contract.py'
      - 'tests/test_murphy_0006_0007_upstream_fact_adapter.py'
      - '.github/workflows/murphy-evidence-adapter-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest pandas
      - name: Run Murphy 0006/0007 tests
        run: python -m pytest -q tests/test_murphy_0006_0007_evidence_adapter.py tests/test_murphy_0006_0007_confirmation_evidence_layer.py tests/test_murphy_0006_0007_confirmation_evidence_builder.py tests/test_murphy_0006_0007_real_data_runner_contract.py tests/test_murphy_0006_0007_upstream_fact_adapter.py
