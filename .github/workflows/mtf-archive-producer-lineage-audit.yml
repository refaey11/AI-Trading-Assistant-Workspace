name: MTF Archive Producer Lineage Audit

on:
  push:
    branches:
      - audit/mtf-archive-producer-lineage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/mtf-archive-producer-lineage
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install pandas pytest

      - name: Acquire original MTF archives from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$DROPBOX_ACCESS_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//; s/^"//; s/"$//')"
          test -n "$TOKEN"
          mkdir -p artifacts/source
          download() {
            local source_path="$1"
            local output="$2"
            local dropbox_arg
            dropbox_arg="$(python -c 'import json,sys; print(json.dumps({"path":sys.argv[1]}))' "$source_path")"
            curl -L --fail --silent --show-error \
              https://content.dropboxapi.com/2/files/download \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Dropbox-API-Arg: ${dropbox_arg}" \
              -o "$output"
          }
          download "/GBPUSD_MARKET_STRUCTURE_ALL_TF_V1.zip" artifacts/source/GBPUSD_MARKET_STRUCTURE_ALL_TF_V1.zip
          download "/MTF_ALIGNMENT_GBPUSD_V1.zip" artifacts/source/MTF_ALIGNMENT_GBPUSD_V1.zip
          download "/GBPUSD_M1_MASTER_2016_2026_V1.zip" artifacts/source/GBPUSD_M1_MASTER_2016_2026_V1.zip
          download "/MULTI_TF_MARKET_DATA_V1.zip" artifacts/source/MULTI_TF_MARKET_DATA_V1.zip
          download "/FEATURE_ENGINEERING_V1_HIGHER_TF.zip" artifacts/source/FEATURE_ENGINEERING_V1_HIGHER_TF.zip
          download "/AI_Trading_Assistant_CORE_V1.zip" artifacts/source/AI_Trading_Assistant_CORE_V1.zip
          download "/AI_Trading_Assistant_FULL_PROJECT_V1.zip" artifacts/source/AI_Trading_Assistant_FULL_PROJECT_V1.zip
          ls -lh artifacts/source

      - name: Scan archive manifests and producer candidates
        run: python tools/audit_mtf_archive_producer_lineage_v1.py --archive artifacts/source/GBPUSD_MARKET_STRUCTURE_ALL_TF_V1.zip --archive artifacts/source/MTF_ALIGNMENT_GBPUSD_V1.zip --archive artifacts/source/GBPUSD_M1_MASTER_2016_2026_V1.zip --archive artifacts/source/MULTI_TF_MARKET_DATA_V1.zip --archive artifacts/source/FEATURE_ENGINEERING_V1_HIGHER_TF.zip --archive artifacts/source/AI_Trading_Assistant_CORE_V1.zip --archive artifacts/source/AI_Trading_Assistant_FULL_PROJECT_V1.zip --output artifacts/MTF_ARCHIVE_PRODUCER_LINEAGE_AUDIT.json

      - name: Test and reconcile GBPUSD M1 to existing six-timeframe candles (2016-2024 only)
        run: |
          pytest -q tests/test_m1_to_mtf_candle_reconciliation_v1.py
          python tools/validate_m1_to_mtf_candle_reconciliation_v1.py --m1-archive artifacts/source/GBPUSD_M1_MASTER_2016_2026_V1.zip --mtf-archive artifacts/source/MULTI_TF_MARKET_DATA_V1.zip --output artifacts/GBPUSD_M1_TO_MULTITF_CANDLE_RECONCILIATION_2016_2024.json

      - name: Upload read-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtf-archive-producer-lineage-audit
          path: |
            artifacts/MTF_ARCHIVE_PRODUCER_LINEAGE_AUDIT.json
            artifacts/GBPUSD_M1_TO_MULTITF_CANDLE_RECONCILIATION_2016_2024.json
          if-no-files-found: error
