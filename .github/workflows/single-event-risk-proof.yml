name: Single Event Risk Proof

on:
  push:
    paths:
      - "RUNTIME/DECISION_RUNTIME_V1/test_real_event_risk_geometry_v1.py"
      - "risk_engine/risk_execution_runtime_v1.py"
  workflow_dispatch:

jobs:
  single_event_risk_proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run single-event risk geometry proof
        run: python -m pytest -q RUNTIME/DECISION_RUNTIME_V1/test_real_event_risk_geometry_v1.py
