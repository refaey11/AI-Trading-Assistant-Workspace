name: Backtest Runner MTF Fail-Closed Tests

on:
  pull_request:
    paths:
      - "BACKTEST/DEV_BACKTEST_RUNNER_V1.py"
      - "BACKTEST/test_dev_backtest_runner_mtf_safety_v1.py"
      - ".github/workflows/backtest-runner-mtf-fail-closed-v1.yml"
  push:
    branches:
      - "fix/backtest-runner-mtf-fail-closed-v1"
    paths:
      - "BACKTEST/DEV_BACKTEST_RUNNER_V1.py"
      - "BACKTEST/test_dev_backtest_runner_mtf_safety_v1.py"
      - ".github/workflows/backtest-runner-mtf-fail-closed-v1.yml"

permissions:
  contents: read

jobs:
  mtf-runner-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run fail-closed regression tests
        run: pytest -q BACKTEST/test_dev_backtest_runner_mtf_safety_v1.py
