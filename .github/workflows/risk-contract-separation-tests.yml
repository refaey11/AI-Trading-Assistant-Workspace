name: Risk Contract Separation Tests

on:
  push:
    branches:
      - audit/risk-contract-separation-2r-3r
  pull_request:
    branches:
      - current-stack-dev-backtest-2016-2024-v3

permissions:
  contents: read

jobs:
  risk-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas
      - name: Run canonical and candidate contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            RUNTIME/RISK_ENGINE_INTEGRATION_V1/test_risk_engine_contract_reconciliation_v1.py \
            tests/risk_engine/test_risk_contract_separation_v1.py \
            DEVELOPMENT_2016_2024/test_v5_4_contract.py
