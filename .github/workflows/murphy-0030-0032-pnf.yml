name: Murphy 0030-0032 P&F QA

on:
  pull_request:
    paths:
      - 'src/murphy_0030_0032/**'
      - 'tests/murphy_0030_0032/**'
      - '.github/workflows/murphy-0030-0032-pnf.yml'
  push:
    branches:
      - 'proposal/murphy-0030-box-policy-v1'

jobs:
  pnf-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Murphy 0030-0032 unit tests
        run: python -m pytest -q tests/murphy_0030_0032
