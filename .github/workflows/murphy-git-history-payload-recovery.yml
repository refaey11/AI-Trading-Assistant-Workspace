name: Murphy Git History Payload Recovery

on:
  push:
    branches:
      - diagnostic/murphy-34-recovery-2026-09-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh all refs
        run: git fetch --all --prune

      - name: Run Murphy payload recovery audit
        run: python BACKTEST/MURPHY_GIT_HISTORY_PAYLOAD_RECOVERY_V1.py

      - name: Upload recovered payload package
        uses: actions/upload-artifact@v4
        with:
          name: murphy-git-history-payload-recovery-v1
          path: murphy_git_history_recovery/
          if-no-files-found: error
          retention-days: 30
