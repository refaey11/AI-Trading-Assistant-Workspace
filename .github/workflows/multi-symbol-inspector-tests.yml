name: Multi-Symbol Source Inspector Tests

on:
  pull_request:
    paths:
      - "BACKTEST/MTF_SIX_TF_SOURCE_ADAPTER_V1.py"
      - "tests/test_mtf_six_tf_source_adapter_v1.py"
      - ".github/workflows/multi-symbol-inspector-tests.yml"
  push:
    branches: ["work/multi-pair-ingestion-plan-v1"]
    paths:
      - "BACKTEST/MTF_SIX_TF_SOURCE_ADAPTER_V1.py"
      - "tests/test_mtf_six_tf_source_adapter_v1.py"
      - ".github/workflows/multi-symbol-inspector-tests.yml"

jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pandas
      - name: Run multi-symbol inspector tests
        run: python -m unittest discover -s tests -p "test_mtf_six_tf_source_adapter_v1.py" -v
