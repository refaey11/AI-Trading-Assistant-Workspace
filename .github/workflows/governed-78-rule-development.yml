name: Governed 78-Rule Development Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BACKTEST/**'
      - 'RECOVERED_SOURCES/**'
      - 'RUNTIME/**'
      - 'governance/**'
      - '.github/workflows/governed-78-rule-development.yml'

permissions:
  contents: read

jobs:
  governed-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: python -m pip install --upgrade pip pandas pytest

      - name: Acquire authoritative governed inputs
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -eu
          test -n "$DROPBOX_ACCESS_TOKEN"
          mkdir -p artifacts/source artifacts/murphy artifacts/nison artifacts/mtf
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['DROPBOX_ACCESS_TOKEN']
          def dl(remote, local):
              req=urllib.request.Request(
                  'https://content.dropboxapi.com/2/files/download', data=b'', method='POST',
                  headers={'Authorization':f'Bearer {token}', 'Dropbox-API-Arg':json.dumps({'path':remote})})
              with urllib.request.urlopen(req, timeout=900) as r, open(local,'wb') as f:
                  while True:
                      chunk=r.read(4*1024*1024)
                      if not chunk: break
                      f.write(chunk)
          dl('/New 8/GBPUSD_H1_2016_2025_MASTER.zip','artifacts/source/h1.zip')
          dl('/New 8/NISON_2016_2024_FULL_EVIDENCE.csv','artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv')
          dl('/New 8/MURPHY_HISTORICAL_34_RULE_FANIN_2016_2024.zip','artifacts/murphy/murphy.zip')
          dl('/New 8/GBPUSD_MARKET_STATE 6.csv','artifacts/market_state.csv')
          dl('/MTF_ALIGNMENT_GBPUSD_V1.zip','artifacts/mtf/mtf_alignment.zip')
          PY
          unzip -q artifacts/source/h1.zip -d artifacts/source
          unzip -q artifacts/murphy/murphy.zip -d artifacts/murphy
          unzip -q artifacts/mtf/mtf_alignment.zip -d artifacts/mtf/extracted
          H1=$(find artifacts/source -type f -name 'GBPUSD_H1_2016_2025_MASTER.csv' | head -1)
          MURPHY=$(find artifacts/murphy -type f -name 'MURPHY_2016_2024_FULL_EVIDENCE.csv' | head -1)
          test -n "$H1"
          test -n "$MURPHY"
          test -n "$(find artifacts/mtf/extracted -type f -name '*.csv' | head -1)"
          echo "H1=$H1" >> "$GITHUB_ENV"
          echo "MURPHY=$MURPHY" >> "$GITHUB_ENV"
          echo "MTF_DIR=artifacts/mtf/extracted" >> "$GITHUB_ENV"
          echo "MTF archive contents:"
          find artifacts/mtf/extracted -type f -maxdepth 6 | sort

      - name: Validate governed 78-rule evidence envelope
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          allow=json.loads(Path('governance/DECISION_BRAIN_RULE_ALLOWLIST_V1.json').read_text())['verified_runtime']
          expected=set(allow['MURPHY'])|set(allow['NISON'])
          n=pd.read_csv('artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv',usecols=['rule_id'])
          murphy=pd.read_csv('${{ env.MURPHY }}',usecols=['source_rule_id'])
          observed_n=set(n.rule_id.dropna().astype(str))
          observed_m=set()
          for v in murphy.source_rule_id.dropna(): observed_m.update(x.strip() for x in str(v).split('|') if x.strip())
          unknown=(observed_n|observed_m)-expected
          if unknown: raise SystemExit(f'UNKNOWN_RULE_IDS:{sorted(unknown)}')
          if len(observed_n)!=44: raise SystemExit(f'NISON_RULE_COUNT={len(observed_n)} expected=44')
          print(json.dumps({'governed_expected':len(expected),'nison_observed':len(observed_n),'murphy_observed':len(observed_m),'murphy_missing_from_source':sorted(set(allow['MURPHY'])-observed_m)},indent=2))
          PY

      - name: Run existing Decision Brain runner with real Murphy + real Nison + existing MTF
        run: |
          python BACKTEST/DEV_BACKTEST_RUNNER_V1.py             --h1 "$H1"             --murphy "$MURPHY"             --nison artifacts/nison/NISON_2016_2024_FULL_EVIDENCE.csv             --context artifacts/market_state.csv             --mtf-dir "$MTF_DIR"             --output-dir artifacts/governed_78_rule_2016_2024

      - name: Write OOS lock manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d={
            'model':'Decision_Brain_V1_governed_78_rule_diagnostic',
            'development_window':'2016-2024',
            'oos_window':'2025',
            'oos_locked':True,
            'parameter_tuning_on_2025':False,
            'nison_role':'confirmation_or_contradiction_only',
            'murphy_role':'directional_context',
            'similarity_role':'historical_evidence_only',
            'tiz_role':'process_psychology_gate_only',
            'costs_applied':False,
            'official_profitability_claim_allowed':False,
            'mtf_source':'/MTF_ALIGNMENT_GBPUSD_V1.zip'
          }
          Path('artifacts/governed_78_rule_2016_2024/oos_lock_manifest.json').write_text(json.dumps(d,indent=2),encoding='utf-8')
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-78-rule-development-backtest
          path: artifacts/

# Existing source-backed MTF alignment is consumed; no synthetic timeframe mapping.
