name: Murphy 0042-0045 Risk Tests

'on':
  workflow_dispatch:
  push:
    paths:
      - 'risk_engine/**'
      - 'tests/risk_engine/test_murphy_0042_0045_gate_adapter.py'
      - '.github/workflows/murphy-0042-0045-risk-tests.yml'
  pull_request:
    paths:
      - 'risk_engine/**'
      - 'tests/risk_engine/test_murphy_0042_0045_gate_adapter.py'
      - '.github/workflows/murphy-0042-0045-risk-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Murphy 0042-0045 gate tests
        run: python -m pytest -q tests/risk_engine/test_murphy_0042_0045_gate_adapter.py
