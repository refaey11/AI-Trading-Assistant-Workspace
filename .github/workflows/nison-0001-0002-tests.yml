name: Nison 0001-0002 Adapter Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nison-hybrid-44-batch-v1
    paths:
      - 'nison_batch/adapter_gate_0001_0002.py'
      - 'nison_batch/test_adapter_gate_0001_0002.py'
      - 'nison_batch/test_availability_gate_0001_0002.py'
      - '.github/workflows/nison-0001-0002-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nison_batch/**'
      - '.github/workflows/nison-0001-0002-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run deterministic tests without external test runner
        shell: bash
        run: |
          set -euo pipefail
          cd nison_batch
          python -m unittest discover -p 'test_*0001_0002.py' -v

      - name: Governance check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('nison_batch/adapter_gate_0001_0002.py').read_text(encoding='utf-8')
          forbidden = ('2025', 'ATR', 'pip', 'lookback', 'tolerance', 'score', 'confidence_delta')
          bad = [x for x in forbidden if x in text]
          if bad:
              raise SystemExit('Governance violation: ' + ', '.join(bad))
          print('Governance gate PASS: no 2025 tuning or invented threshold/score logic in 0001-0002 hard-geometry gate.')
          PY
